    --ink-faint:#818A99;

    --surface-2:#E7EAEB;

    --navy:#122040;
    --navy-2:#1B2E54;
    --accent:#E3A008;
    --accent-text:#8A5A00;
    --live:#1E9E64;

  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E9EBF0;
      --ink-soft:#A6ADBB;
      --ink-faint:#6C7482;
      --paper:#0B0F17;
      --surface:#121826;
      --surface-2:#1A2233;
      --line:#252E40;
      --navy:#0B1220;
      --navy-2:#111A2E;
      --accent:#F0B429;
      --accent-text:#FFCB66;
      --live:#34D399;

  }
  :root[data-theme="dark"]{
    --ink:#E9EBF0;
    --ink-soft:#A6ADBB;
    --ink-faint:#6C7482;
    --paper:#0B0F17;
    --surface:#121826;
    --surface-2:#1A2233;
    --line:#252E40;
    --navy:#0B1220;
    --navy-2:#111A2E;
    --accent:#F0B429;
    --accent-text:#FFCB66;
    --live:#34D399;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Noto Sans SC","IBM Plex Sans",sans-serif;
    line-height:1.6;
  }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--accent-text); outline-offset:2px; }

  .mono{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }

  /* ---------- header ---------- */
  header.site{
    background: linear-gradient(180deg, var(--navy), var(--navy-2));
    color:#F4F6FA;
    padding: 18px clamp(14px,3vw,32px) 16px;
  }
  .header-row{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand-name{
    font-family:"Anton",sans-serif;
    font-size:clamp(28px,4vw,40px);
    letter-spacing:0.5px;
    line-height:1;
    color:#F4F6FA;
  }
  .brand-name span{ color:var(--accent); }
  .brand-tagline{
    font-size:12.5px; color:#B9C2D4; letter-spacing:0.04em;
  }
  .status-cluster{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .live-pill{
    display:flex; align-items:center; gap:7px;
    font-size:12px; letter-spacing:0.08em; color:#CFE9DA;
    background:rgba(30,158,100,0.14);
    border:1px solid rgba(52,211,153,0.35);
    padding:5px 10px 5px 8px; border-radius:999px;
  }
  .live-dot{
    width:7px; height:7px; border-radius:50%; background:var(--live);
    box-shadow:0 0 0 0 rgba(52,211,153,0.6);
  }
  @media (prefers-reduced-motion:no-preference){
    .live-dot{ animation:pulse 2s ease-in-out infinite; }
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(52,211,153,0.55); }
    70%{ box-shadow:0 0 0 7px rgba(52,211,153,0); }
    100%{ box-shadow:0 0 0 0 rgba(52,211,153,0); }
  }
  .updated-text{ font-size:12.5px; color:#B9C2D4; }
  .updated-text b{ color:#F4F6FA; font-weight:600; }
  .lang-select{
    font:inherit; font-size:12.5px; font-weight:600;
    background:rgba(255,255,255,0.08); color:#F4F6FA;
    border:1px solid rgba(255,255,255,0.22); border-radius:7px;
    padding:6px 10px; cursor:pointer;
  }
  .lang-select:hover{ background:rgba(255,255,255,0.14); }
  .lang-select option{ color:#16181D; }

  /* ---------- scoreboard tally ---------- */
  .tally-wrap{
    background:var(--navy);
    border-top:1px solid rgba(255,255,255,0.06);
    overflow-x:auto;
  }
  .tally{
    display:flex; gap:1px; min-width:max-content;
    padding:0 clamp(14px,3vw,32px);
  }
  .tally-tile{
    all:unset; cursor:pointer;
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    padding:10px 16px 12px; min-width:92px;
    border-bottom:3px solid transparent;
    color:#C7D0E0;
  }
  .tally-tile:hover{ background:rgba(255,255,255,0.05); }
  .tally-tile[aria-pressed="true"]{
    border-bottom-color:var(--accent); color:#fff;
  }
  .tally-label{ font-size:11.5px; letter-spacing:0.03em; white-space:nowrap; }
  .tally-count{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:20px; font-weight:600; color:var(--accent); }
  .tally-tile[aria-pressed="true"] .tally-count{ color:#FFD873; }

  /* ---------- controls ---------- */
  .controls{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:16px clamp(14px,3vw,32px) 6px;
  }
  .chip{
    all:unset; cursor:pointer; font-size:13px;
    padding:7px 13px; border-radius:999px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  }
  .chip:hover{ border-color:var(--ink-faint); }
  .chip[aria-pressed="true"]{
    background:var(--accent); border-color:var(--accent); color:#241800; font-weight:600;
  }
  .japan-banner{
    display:flex; align-items:center; gap:14px;
    margin:6px clamp(14px,3vw,32px) 4px;
    padding:14px 18px;
    background:linear-gradient(135deg, #C8393F, #A32B31);
    border-radius:12px;
    box-shadow:var(--shadow);
  }
  .japan-banner-flag{ font-size:28px; line-height:1; }
  .japan-banner-title{ font-size:16px; font-weight:700; color:#fff; }
  .japan-banner-sub{ font-size:12.5px; color:rgba(255,255,255,0.85); margin-top:2px; }
  .search-box{
    margin-left:auto; position:relative; min-width:200px; flex:0 1 260px;
  }
  .search-box input{
    width:100%; font:inherit; font-size:13.5px;
    padding:9px 12px 9px 32px; border-radius:999px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
  }
  .search-box input::placeholder{ color:var(--ink-faint); }
  .search-box svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:0.55; }

  .result-line{
    padding:6px clamp(14px,3vw,32px) 4px; font-size:12.5px; color:var(--ink-faint);
  }

  /* ---------- grid ---------- */
  main{ padding:8px clamp(14px,3vw,32px) 40px; }
  .grid{
    display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:16px 17px 14px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px;
  }
  .card-top{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .badge-sport{
    font-size:11px; font-weight:700; letter-spacing:0.02em;
    background:var(--navy); color:var(--accent);
    padding:3px 9px; border-radius:5px;
  }
  .badge-topic{
    font-size:11px; color:var(--ink-soft);
    background:var(--surface-2); padding:3px 8px; border-radius:5px;
  }
  .title-main{ font-size:16.5px; font-weight:700; line-height:1.45; }
  .summary-main{ font-size:13.8px; color:var(--ink); }
  .card-foot{
    margin-top:auto; padding-top:10px; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
  }
  .source-line{ font-size:12px; color:var(--ink-faint); }
  .source-line b{ color:var(--ink-soft); font-weight:600; }
  .read-link{
    font-size:12.5px; font-weight:600; color:var(--accent-text);
    text-decoration:none; white-space:nowrap;
  }
  .read-link:hover{ text-decoration:underline; }

  .empty{
    grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--ink-faint); font-size:14px;
  }

  .load-more-wrap{ display:flex; justify-content:center; padding-top:22px; }
  .load-more{
    all:unset; cursor:pointer; font-size:13.5px; font-weight:600;
    padding:10px 22px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft);
  }
  .load-more:hover{ border-color:var(--ink-faint); color:var(--ink); }

  footer.site{
    padding:20px clamp(14px,3vw,32px) 32px; color:var(--ink-faint); font-size:12px;
    border-top:1px solid var(--line);
  }
  footer.site p{ max-width:70ch; }
</style>

    {id:"ioc-top-partners-milano-cortina", sport:"olympics", region:"global", topics:["sponsor","biz"], published_at:"2026-08-01T12:00:00Z",
      source_name:"Olympics.com (IOC)", source_url:"https://www.olympics.com/ioc/news/how-the-worldwide-olympic-partners-make-milano-cortina-2026-possible",
      i18n:{
        en:{title:"How the Worldwide Olympic Partners Make Milano Cortina 2026 Possible", summary:"The IOC's TOP Programme, launched in 1985, grants global brands like Omega, P&G and Salesforce exclusive Olympic marketing rights. Revenue has grown from $96 million in its first four-year cycle to more than $3 billion in the most recent one."},
        ja:{title:"IOC「TOPパートナー」制度、五輪の商業基盤を支える仕組みとは", summary:"1985年発足のIOC「TOPプログラム」は、オメガやP&G、セールスフォースなど世界的企業に五輪マーケティング権を独占的に付与する制度。収入は1985〜88年期の9600万ドルから、直近サイクルでは30億ドル超へと拡大している。"},
        es:{title:"Cómo los Socios Olímpicos Mundiales hacen posible Milán-Cortina 2026", summary:"El Programa TOP del COI, lanzado en 1985, concede a marcas globales como Omega, P&G y Salesforce derechos exclusivos de marketing olímpico. Los ingresos han pasado de $96 millones en su primer ciclo de cuatro años a más de $3.000 millones en el más reciente."},
        zh:{title:"“全球奥林匹克合作伙伴”如何撑起米兰-科尔蒂纳2026冬奥会", summary:"国际奥委会1985年推出的TOP计划,授予欧米茄、宝洁、Salesforce等全球品牌独家奥运营销权益。相关收入已从首个四年周期的9600万美元,增长至最近一个周期的逾30亿美元。"},
        fr:{title:"Comment les Partenaires Olympiques Mondiaux rendent possible Milan-Cortina 2026", summary:"Le programme TOP du CIO, lancé en 1985, accorde à des marques mondiales comme Omega, P&G et Salesforce des droits marketing olympiques exclusifs. Les revenus sont passés de 96 millions de dollars lors du premier cycle de quatre ans à plus de 3 milliards de dollars lors du plus récent."},

    {id:"seahawks-khosla-sale-closes", sport:"football", region:"global", topics:["team","biz"], published_at:"2026-09-03T20:00:00Z",
      source_name:"NFL.com", source_url:"https://www.nfl.com/news/khosla-family-closes-purchase-seahawks",
      i18n:{
        en:{title:"Seahawks Sale to Khosla Family Officially Closes at Record $9.6 Billion", summary:"The sale of the Seattle Seahawks from the Paul Allen estate to a group led by the Khosla family (Vinod, Neeru and Neal Khosla) officially closed on Sept. 3, at roughly $9.612 billion — the highest price ever paid for an NFL franchise, and a rare case of a reigning Super Bowl champion changing hands within months of the title."},
        ja:{title:"シーホークス売却が完了、96億ドル超でNFL史上最高額に", summary:"ポール・アレン氏の遺産財団からコースラ家(ヴィノード、ニール、ニーラ氏)へのシアトル・シーホークス売却が9月3日に正式完了した。売却額は約96.12億ドルとNFL球団売却史上最高額を更新し、前年のスーパーボウル王者が数ヶ月内に売却される異例のケースとなった。"},
        es:{title:"La venta de los Seahawks a la familia Khosla se cierra oficialmente por un récord de $9.600M", summary:"La venta de los Seattle Seahawks del patrimonio de Paul Allen a un grupo liderado por la familia Khosla (Vinod, Neeru y Neal Khosla) se cerró oficialmente el 3 de septiembre por unos $9.612M — el precio más alto jamás pagado por una franquicia de la NFL, y un caso poco habitual de un campeón vigente de la Super Bowl cambiando de dueño meses después del título."},
        zh:{title:"西雅图海鹰队售予科斯拉家族正式完成,96亿美元创NFL纪录", summary:"西雅图海鹰队由保罗·艾伦遗产基金会出售给科斯拉家族(维诺德、尼鲁与尼尔·科斯拉)领衔的团队一事已于9月3日正式完成交割,交易额约为96.12亿美元,创下NFL球队交易历史最高纪录,也是罕见的卫冕超级碗冠军在夺冠数月内易主的案例。"},
        fr:{title:"La vente des Seahawks à la famille Khosla est officiellement finalisée pour un record de 9,6 Md$", summary:"La vente des Seattle Seahawks par la succession de Paul Allen à un groupe mené par la famille Khosla (Vinod, Neeru et Neal Khosla) a été officiellement finalisée le 3 septembre, pour environ 9,612 Md$ — le prix le plus élevé jamais payé pour une franchise NFL, et un cas rare de champion en titre du Super Bowl changeant de mains quelques mois après son sacre."},
      }},
    {id:"cnbc-nfl-valuations-2026", sport:"football", region:"global", topics:["biz","team"], published_at:"2026-09-09T10:00:00Z",
      source_name:"CNBC", source_url:"https://www.cnbc.com/2026/09/09/cnbcs-official-nfl-team-valuations-2026-heres-how-the-32-franchises-stack-up.html",
      i18n:{
        en:{title:"CNBC's 2026 NFL Valuations: Average Franchise Now $10.36 Billion, Up 35%", summary:"CNBC's latest NFL franchise valuations put the league average at $10.36 billion, up 35% year over year. The Dallas Cowboys remain No. 1 at $16 billion on the back of the league's highest revenue, with the Rams, Raiders, Giants and Patriots joining them above the $12 billion mark."},
        ja:{title:"CNBC版NFL球団価値2026、平均103.6億ドルで前年比35%増", summary:"CNBCが算定したNFL32球団の価値ランキングで、平均球団価値は103.6億ドルと前年比35%増を記録した。ダラス・カウボーイズが160億ドルで首位を維持し、ロサンゼルス・ラムズ、ラスベガス・レイダーズなど120億ドルを超える球団が5つに達した。"},
        es:{title:"Valoraciones NFL 2026 de CNBC: la franquicia media ya vale $10.360M, +35%", summary:"Las últimas valoraciones de franquicias de la NFL de CNBC sitúan la media de la liga en $10.360M, un 35% más interanual. Los Dallas Cowboys siguen siendo el número 1 con $16.000M, respaldados por los mayores ingresos de la liga, mientras Rams, Raiders, Giants y Patriots se unen a ellos por encima de los $12.000M."},
        zh:{title:"CNBC 2026年NFL估值:平均球队价值达103.6亿美元,增长35%", summary:"CNBC最新NFL球队估值显示,联盟平均价值达103.6亿美元,同比增长35%。达拉斯牛仔队凭借联盟最高营收继续以160亿美元位列第一,公羊、突袭者、巨人和爱国者队也跻身120亿美元以上行列。"},
        fr:{title:"Valorisations NFL 2026 de CNBC : la franchise moyenne à 10,36 Md$, en hausse de 35 %", summary:"Les dernières valorisations NFL de CNBC placent la moyenne de la ligue à 10,36 Md$, en hausse de 35 % sur un an. Les Cowboys de Dallas restent numéro un à 16 Md$ grâce aux revenus les plus élevés de la ligue, les Rams, Raiders, Giants et Patriots les rejoignant au-dessus des 12 Md$."},
      }},
    {id:"forest-marex-shirt-sponsorship", sport:"soccer", region:"global", topics:["sponsor"], published_at:"2026-08-18T09:00:00Z",
      source_name:"Nottingham Forest FC", source_url:"https://www.nottinghamforest.co.uk/news/2026/august/18/forest-announces-marex-as-principal-partner/",
      i18n:{
        en:{title:"Nottingham Forest Names Marex Principal Partner in Multi-Year Shirt Deal", summary:"Premier League side Nottingham Forest has signed global financial services firm Marex as principal partner in a multi-year deal reportedly worth about £25 million over three years, taking over front-of-shirt sponsorship on the men's, women's and netball kits from outgoing gambling sponsor Bally's."},
        ja:{title:"ノッティンガム・フォレスト、金融大手Marexと複数年のユニフォームスポンサー契約", summary:"プレミアリーグのノッティンガム・フォレストは、金融サービス大手Marexと複数年のプリンシパルパートナー契約を締結し、男女トップチームとネットボールチームのユニフォーム胸部スポンサーとなる。契約額は3年間で約2500万ポンドとされ、ギャンブル企業Bally'sに代わる新スポンサーとなった。"},
        es:{title:"Nottingham Forest nombra a Marex socio principal en un contrato plurianual de camiseta", summary:"El Nottingham Forest de la Premier League ha fichado a la firma financiera global Marex como socio principal en un acuerdo plurianual valorado en unos £25M a tres años, asumiendo el patrocinio frontal de la camiseta masculina, femenina y de netball, en sustitución de la casa de apuestas Bally's."},
        zh:{title:"诺丁汉森林队官宣Marex为多年期胸前广告首席合作伙伴", summary:"英超诺丁汉森林队与全球金融服务公司Marex签署多年期首席合作伙伴协议,据报三年总额约2500万英镑,接替原博彩赞助商Bally's,成为男女一线队及无板篮球队的胸前广告赞助商。"},
        fr:{title:"Nottingham Forest nomme Marex partenaire principal dans un contrat de maillot pluriannuel", summary:"Le club de Premier League Nottingham Forest a signé la société de services financiers mondiale Marex comme partenaire principal, dans un accord pluriannuel évalué à environ 25 M£ sur trois ans, reprenant le sponsoring frontal des maillots masculins, féminins et de netball auprès du sponsor de paris sortant Bally's."},

        ja:{title:"マンチェスター・ユナイテッド、Betwayとトレーニングキットで世界最高額契約", summary:"マンチェスター・ユナイテッドはオンライン賭博企業Betwayと、年間約2000万ポンドとされる複数年のトレーニングキットスポンサー契約を締結した。クラブ史上最大規模とされ、前年に失効したTezosとの契約枠を埋める形となった。"},

        zh:{title:"曼联与Betway签下全球最高额训练服赞助合约", summary:"曼联与在线博彩公司Betway达成多年期训练服赞助协议,据报每季约2000万英镑,号称全球同类合约中金额最高,填补了此前与Tezos合约到期后留下的空缺。"},

    {id:"sporting-kc-mallouk-sale", sport:"soccer", region:"global", topics:["team","biz"], published_at:"2026-01-16T12:00:00Z",
      source_name:"SportsPro", source_url:"https://www.sportspro.com/news/finance-investment/sporting-kansas-city-sale-peter-mallouk-illig-ownership-valuation-mls-january-2026/",
      i18n:{
        en:{title:"Sporting KC Sold to Peter Mallouk in MLS-Record $700 Million Deal", summary:"MLS club Sporting Kansas City's controlling stake has been sold by the Illig family to minority owner Peter Mallouk, CEO of wealth manager Creative Planning, at an enterprise valuation of roughly $700 million — a league record for a controlling-stake sale, with the Illigs retaining a small minority interest."},
        ja:{title:"スポーティングKC、MLS史上最高額の7億ドルでマルーク氏に売却", summary:"MLSのスポーティング・カンザスシティは、イリグ家が保有していた過半数株式を、資産運用会社Creative Planning代表のピーター・マルーク氏に売却した。企業価値は約7億ドルとMLSクラブとして過去最高額となり、イリグ家は少数株主として残る。"},
        es:{title:"Sporting KC se vende a Peter Mallouk por $700M, récord de la MLS", summary:"La participación mayoritaria del Sporting Kansas City de la MLS ha sido vendida por la familia Illig al accionista minoritario Peter Mallouk, CEO de la gestora de patrimonio Creative Planning, con una valoración empresarial de unos $700M — un récord de la liga en venta de participación de control, y la familia Illig conserva una pequeña participación minoritaria."},
        zh:{title:"堪萨斯城竞技队以7亿美元创MLS纪录出售给马卢克", summary:"MLS球队堪萨斯城竞技队的控股权已由伊利格家族出售给少数股东、财富管理公司Creative Planning首席执行官彼得·马卢克,企业估值约7亿美元,创下联盟控股权交易纪录,伊利格家族保留小部分少数股权。"},
        fr:{title:"Sporting KC vendu à Peter Mallouk pour un record MLS de 700 M$", summary:"La participation majoritaire du club de MLS Sporting Kansas City a été cédée par la famille Illig à l'actionnaire minoritaire Peter Mallouk, PDG du gestionnaire de patrimoine Creative Planning, pour une valorisation d'entreprise d'environ 700 M$ — un record de la ligue pour une vente de participation majoritaire, la famille Illig conservant une petite part minoritaire."},
      }},
    {id:"tottenham-hpe-network-expansion", sport:"soccer", region:"global", topics:["tech","stadium"], published_at:"2026-09-02T09:00:00Z",
      source_name:"HPE", source_url:"https://www.hpe.com/us/en/newsroom/press-release/2026/09/tottenham-hotspur-and-hpe-transform-digital-fan-experience-and-stadium-operations.html",
      i18n:{
        en:{title:"Tottenham Hotspur Expands HPE Partnership to Overhaul Stadium IT", summary:"Tottenham Hotspur has expanded its technology partnership with HPE, rebuilding the stadium's IT backbone on HPE's GreenLake hybrid-cloud platform. The project consolidates previously distributed compute and storage into two core environments and will roll out outdoor Wi-Fi 7, ticketless entry and cashless payments."},
        ja:{title:"トッテナム、HPEとのスタジアムIT基盤刷新パートナーシップを拡大", summary:"トッテナム・ホットスパーはHPEとの提携を拡大し、スタジアムのIT基盤をHPE GreenLakeのハイブリッドクラウドで刷新する。分散していた設備を2拠点に集約し、屋外初の部類となるWi-Fi 7導入やキャッシュレス決済など、来場者体験のデジタル化を進める。"},
        es:{title:"Tottenham Hotspur amplía su alianza con HPE para renovar la infraestructura TI del estadio", summary:"El Tottenham Hotspur ha ampliado su alianza tecnológica con HPE para reconstruir la columna vertebral TI del estadio sobre la plataforma de nube híbrida GreenLake de HPE. El proyecto consolida el cómputo y almacenamiento antes distribuidos en dos entornos centrales, e implantará Wi-Fi 7 exterior, entrada sin ticket y pagos sin efectivo."},
        zh:{title:"托特纳姆热刺扩大与HPE合作,全面升级球场IT架构", summary:"托特纳姆热刺扩大了与HPE的技术合作,基于HPE GreenLake混合云平台重建球场IT主干网络。该项目将原本分散的计算与存储资源整合至两个核心环境,并将部署业内领先的室外Wi-Fi 7、无票入场及无现金支付。"},
        fr:{title:"Tottenham Hotspur élargit son partenariat avec HPE pour refondre l'infrastructure IT du stade", summary:"Tottenham Hotspur a élargi son partenariat technologique avec HPE, reconstruisant l'ossature informatique du stade sur la plateforme cloud hybride GreenLake d'HPE. Le projet regroupe le calcul et le stockage auparavant dispersés en deux environnements centraux, et déploiera le Wi-Fi 7 en extérieur, l'entrée sans billet et les paiements sans espèces."},
      }},
    {id:"cavaliers-dazn-local-streaming-deal", sport:"basketball", region:"global", topics:["tech","biz"], published_at:"2026-09-01T09:00:00Z",
      source_name:"Cavaliers.com", source_url:"https://cavs.com/news/releases-cavaliers-dazn-260901",
      i18n:{
        en:{title:"Cavaliers Move Local Broadcasts to DAZN for 2026-27 Season", summary:"The Cleveland Cavaliers have signed a multiyear deal making DAZN their exclusive local streaming partner starting in 2026-27, with plans from $19.99 a month and 15 games free. Cleveland becomes the third NBA team, after Minnesota and Indiana, to go DAZN-exclusive following the collapse of regional broadcaster Main Street Sports Group."},
        ja:{title:"NBAキャバリアーズ、地元放送をDAZNへ全面移行", summary:"NBAのクリーブランド・キャバリアーズは、2026-27シーズンから地元放送権をストリーミングのDAZNへ全面移行する複数年契約を発表した。月額19.99ドルからのプランで全試合を配信し、15試合は無料視聴可能。地方放送網Main Street Sports Groupの経営破綻を受け、ミネソタ、インディアナに続き3球団目のDAZN専属チームとなる。"},
        es:{title:"Los Cavaliers trasladan su emisión local a DAZN para la temporada 2026-27", summary:"Los Cleveland Cavaliers han firmado un acuerdo plurianual que convierte a DAZN en su socio exclusivo de streaming local desde 2026-27, con planes desde $19,99 al mes y 15 partidos gratuitos. Cleveland se convierte en el tercer equipo de la NBA, tras Minnesota e Indiana, en pasarse en exclusiva a DAZN tras la quiebra de la cadena regional Main Street Sports Group."},
        zh:{title:"骑士队2026-27赛季地方转播全面转投DAZN", summary:"克利夫兰骑士队签署多年期协议,自2026-27赛季起将DAZN定为独家地方流媒体转播伙伴,套餐月费19.99美元起,并提供15场免费观看。继明尼苏达和印第安纳之后,骑士队成为地方转播商Main Street Sports Group破产后第三支转投DAZN独家转播的NBA球队。"},
        fr:{title:"Les Cavaliers basculent leur diffusion locale sur DAZN pour la saison 2026-27", summary:"Les Cavaliers de Cleveland ont signé un accord pluriannuel faisant de DAZN leur partenaire exclusif de streaming local à partir de 2026-27, avec des forfaits dès 19,99 $ par mois et 15 matchs gratuits. Cleveland devient la troisième équipe NBA, après le Minnesota et l'Indiana, à passer en exclusivité chez DAZN suite à l'effondrement du diffuseur régional Main Street Sports Group."},
      }},
    {id:"allegiant-stadium-north-entrance-upgrade", sport:"football", region:"global", topics:["stadium"], published_at:"2026-09-03T20:00:00Z",
      source_name:"NFL.com", source_url:"https://www.nfl.com/news/las-vegas-stadium-authority-approves-75-million-upgrades-allegiant-stadium",
      i18n:{
        en:{title:"Las Vegas Approves $75M in Public Funds for $158M Allegiant Stadium Upgrade", summary:"The Las Vegas Stadium Authority has approved $75 million in public funding toward a $158 million overhaul of Allegiant Stadium's congested north entrance, with the Raiders covering the remaining $83 million. The project adds pedestrian decks and a plaza to ease Strip-side access, targeting completion by late 2028."},
        ja:{title:"アレジアント・スタジアム、1.58億ドル規模の北口改修に公費7500万ドル承認", summary:"ラスベガス・スタジアム公社は、レイダーズの本拠地アレジアント・スタジアム北口の1.58億ドル規模の改修に向け、公費7500万ドルの拠出を承認した。残る8300万ドルはレイダーズが負担し、歩行者デッキや広場を新設して混雑緩和を図る。完成は2028年末を目指す。"},
        es:{title:"Las Vegas aprueba $75M en fondos públicos para una reforma de $158M en el Allegiant Stadium", summary:"La Autoridad del Estadio de Las Vegas ha aprobado $75M en financiación pública para una reforma de $158M de la congestionada entrada norte del Allegiant Stadium, con los Raiders cubriendo los $83M restantes. El proyecto añade pasarelas peatonales y una plaza para facilitar el acceso desde el Strip, con finalización prevista para finales de 2028."},
        zh:{title:"拉斯维加斯批准7500万美元公共资金,用于阿利吉恩特体育场1.58亿美元改造", summary:"拉斯维加斯体育场管理局已批准拨款7500万美元公共资金,用于阿利吉恩特体育场拥堵北入口的1.58亿美元改造工程,其余8300万美元由突袭者队承担。项目将新增人行天桥和广场以缓解毗邻拉斯维加斯大道一侧的通行压力,预计2028年底完工。"},
        fr:{title:"Las Vegas approuve 75 M$ de fonds publics pour une rénovation de 158 M$ de l'Allegiant Stadium", summary:"L'autorité des stades de Las Vegas a approuvé 75 M$ de financement public pour une rénovation de 158 M$ de l'entrée nord engorgée de l'Allegiant Stadium, les Raiders prenant en charge les 83 M$ restants. Le projet ajoute des passerelles piétonnes et une esplanade pour faciliter l'accès côté Strip, avec un achèvement visé fin 2028."},
      }},
    {id:"haier-uefa-champions-league-global-partner", sport:"soccer", region:"global", topics:["sponsor"], published_at:"2026-09-04T09:00:00Z",
      source_name:"Inside World Football", source_url:"https://www.insideworldfootball.com/2026/09/04/haier-uc3-uefa-champions-league-global-partnership",
      i18n:{
        en:{title:"Haier Becomes New Global Partner of the UEFA Champions League", summary:"Chinese appliance giant Haier has signed a four-year global partnership covering the UEFA Champions League and other UEFA club competitions from the 2027-28 through 2030-31 seasons, securing exclusive worldwide sponsorship rights in home appliances, televisions and commercial displays."},
        ja:{title:"中国・ハイアール、UEFAチャンピオンズリーグの新グローバルパートナーに", summary:"中国の家電大手ハイアールは、2027-28シーズンから2030-31シーズンまでの4年間、UEFAチャンピオンズリーグを含む複数のUEFAクラブ大会のグローバルパートナーとなる契約を発表した。家電・テレビ・商業用ディスプレイ分野で独占的な協賛権を獲得する。"},
        es:{title:"Haier se convierte en nuevo socio global de la UEFA Champions League", summary:"El gigante chino de electrodomésticos Haier ha firmado una alianza global de cuatro años que cubre la UEFA Champions League y otras competiciones de clubes de la UEFA desde la temporada 2027-28 hasta la 2030-31, asegurándose derechos exclusivos de patrocinio mundial en electrodomésticos, televisores y pantallas comerciales."},
        zh:{title:"中国海尔成为欧冠联赛新全球合作伙伴", summary:"中国家电巨头海尔已签署为期四年的全球合作协议,覆盖欧冠联赛及其他欧足联俱乐部赛事,时间跨度为2027-28赛季至2030-31赛季,并获得家电、电视机及商用显示领域的全球独家赞助权益。"},
        fr:{title:"Haier devient nouveau partenaire mondial de la Ligue des champions de l'UEFA", summary:"Le géant chinois de l'électroménager Haier a signé un partenariat mondial de quatre ans couvrant la Ligue des champions de l'UEFA et d'autres compétitions de clubs de l'UEFA, de la saison 2027-28 à 2030-31, s'assurant des droits de sponsoring exclusifs dans le monde entier pour l'électroménager, les téléviseurs et les écrans commerciaux."},
      }},
    {id:"savvy-games-moonton-acquisition", sport:"esports", region:"global", topics:["biz","team"], published_at:"2026-03-20T09:00:00Z",
      source_name:"Game Developer", source_url:"https://www.gamedeveloper.com/business/savvy-games-group-agreed-to-buy-moonton-games-for-6-billion",
      i18n:{
        en:{title:"Saudi-Backed Savvy Games Group to Acquire Moonton for More Than $6 Billion", summary:"Saudi Arabia's PIF-owned Savvy Games Group has agreed to acquire Moonton, the studio behind mobile MOBA hit Mobile Legends: Bang Bang, from ByteDance for more than $6 billion — about 50% above the price ByteDance paid in 2021, and one of the largest deals in gaming industry history."},
        ja:{title:"サウジ系Savvy Games、「Mobile Legends」開発元Moontonを60億ドル超で買収", summary:"サウジアラビア公共投資基金傘下のSavvy Games Groupは、ByteDanceから「Mobile Legends: Bang Bang」開発元Moontonを60億ドル超で買収することで合意した。2021年の買収額から約5割増の評価額で、ゲーム業界史上有数の大型M&Aとなる。"},
        es:{title:"Savvy Games Group, respaldado por Arabia Saudí, adquirirá Moonton por más de $6.000M", summary:"Savvy Games Group, propiedad del fondo saudí PIF, ha acordado adquirir Moonton, el estudio detrás del éxito móvil Mobile Legends: Bang Bang, a ByteDance por más de $6.000M — cerca de un 50% más de lo que pagó ByteDance en 2021, y una de las mayores operaciones de la historia de la industria del videojuego."},
        zh:{title:"沙特背景Savvy Games将以逾60亿美元收购Moonton", summary:"沙特主权基金PIF旗下的Savvy Games Group已同意从字节跳动手中以逾60亿美元收购手游《无尽对决》(Mobile Legends: Bang Bang)开发商Moonton,估值较字节跳动2021年收购价高出约五成,成为游戏行业史上规模最大的并购交易之一。"},
        fr:{title:"Le saoudien Savvy Games Group va acquérir Moonton pour plus de 6 Md$", summary:"Savvy Games Group, détenu par le fonds saoudien PIF, a accepté d'acquérir Moonton, le studio derrière le succès mobile Mobile Legends: Bang Bang, auprès de ByteDance pour plus de 6 Md$ — environ 50 % de plus que le prix payé par ByteDance en 2021, l'une des plus grosses opérations de l'histoire du jeu vidéo."},
      }},
    {id:"npb-allstar-homerun-derby-nissan-sponsor", sport:"baseball", region:"japan", topics:["sponsor"], published_at:"2026-07-11T09:00:00Z",
      source_name:"スポーツナビ", source_url:"https://sports.yahoo.co.jp/column/detail/2026071100022-spnaviow",
      i18n:{
        en:{title:"Nissan Named Title Sponsor of NPB All-Star Home Run Derby 2026", summary:"Nippon Professional Baseball has named Nissan Motor as the title sponsor of the Home Run Derby held during the Mynavi All-Star Game 2026, marking a notable automaker tie-in for the league's midseason showcase event."},
        ja:{title:"日産自動車、「マイナビオールスターゲーム2026」ホームランダービーの冠スポンサーに", summary:"日本野球機構は、「マイナビオールスターゲーム2026」で実施されるホームランダービーの冠スポンサーとして日産自動車が決定したと発表した。プロ野球のオールスターイベントにおける自動車メーカーの協賛として注目される。"},
        es:{title:"Nissan, patrocinador principal del Home Run Derby del All-Star de la NPB 2026", summary:"La NPB ha nombrado a Nissan Motor patrocinador principal del Home Run Derby celebrado durante el Mynavi All-Star Game 2026, una destacada alianza con un fabricante de automóviles para el evento estrella de mitad de temporada de la liga."},
        zh:{title:"日产汽车成为2026年NPB全明星本垒打大赛冠名赞助商", summary:"日本职业棒球机构宣布,日产汽车将成为2026年“Mynavi全明星赛”期间举办的本垒打大赛冠名赞助商,是该联赛年中重头活动中一次引人注目的汽车品牌合作。"},
        fr:{title:"Nissan devient sponsor titre du Home Run Derby du All-Star Game NPB 2026", summary:"La ligue de baseball professionnelle japonaise (NPB) a nommé Nissan Motor sponsor titre du Home Run Derby organisé pendant le Mynavi All-Star Game 2026, un partenariat automobile notable pour l'événement vedette de mi-saison de la ligue."},
      }},
    {id:"bills-highmark-stadium-turf-replacement", sport:"football", region:"global", topics:["stadium"], published_at:"2026-09-02T09:00:00Z",
      source_name:"Stadium Tech Report", source_url:"https://stadiumtechreport.com/news/top-stories-from-week-ending-9-4-26/",
      i18n:{
        en:{title:"Bills Replace Natural Grass at New Highmark Stadium Ahead of Season Opener", summary:"The Buffalo Bills are replacing the natural grass surface at their new $2.2 billion Highmark Stadium after portions came loose during preseason games, with the resodding work targeted for completion before the venue's regular-season opener on Sept. 17."},
        ja:{title:"ビルズの新スタジアム、天然芝の不具合を受け開幕前に張り替え", summary:"NFLバッファロー・ビルズは、総工費22億ドルの新本拠地ハイマーク・スタジアムで、プレシーズン中に天然芝の一部が浮き上がる不具合が発生したため、開幕前に芝の張り替え作業を進めている。9月17日のレギュラーシーズン開幕戦までの完了を目指す。"},
        es:{title:"Los Bills reemplazan el césped natural del nuevo Highmark Stadium antes del inicio de temporada", summary:"Los Buffalo Bills están sustituyendo el césped natural de su nuevo estadio Highmark, de $2.200M, después de que varias zonas se soltaran durante partidos de pretemporada, con el resembrado previsto para completarse antes del debut de temporada regular el 17 de septiembre."},
        zh:{title:"比尔斯队在赛季揭幕前更换全新海马克体育场天然草皮", summary:"布法罗比尔斯队斥资22亿美元打造的新主场海马克体育场,因季前赛期间部分草皮出现松动问题,球队正抓紧更换天然草皮,力争在9月17日常规赛揭幕战前完工。"},
        fr:{title:"Les Bills remplacent la pelouse naturelle du nouveau Highmark Stadium avant l'ouverture de la saison", summary:"Les Bills de Buffalo remplacent la pelouse naturelle de leur nouveau stade Highmark, à 2,2 Md$, après que des portions se sont détachées lors de matchs de présaison, les travaux de regarnissage devant être achevés avant le match d'ouverture de la saison régulière le 17 septembre."},
      }},
    {id:"manutd-sumup-sleeve-sponsorship", sport:"soccer", region:"global", topics:["sponsor"], published_at:"2026-09-08T09:00:00Z",
      source_name:"Yahoo Sports", source_url:"https://sports.yahoo.com/articles/man-utd-agree-multi-million-101301094.html",
      i18n:{
        en:{title:"Manchester United Signs Sleeve Sponsorship With Fintech Firm SumUp", summary:"Manchester United have announced a multi-year sleeve sponsorship deal with British fintech firm SumUp, whose branding will appear on the men's, women's and academy kits across all competitions. The partnership also includes a co-branded payment card offering rewards at club outlets and UK businesses, with the sponsor debuting Sept. 10 in the club's Champions League match against Sabah, replacing outgoing sponsor DXC Technology."},
        ja:{title:"マンチェスター・ユナイテッド、フィンテック企業SumUpと袖スポンサー契約", summary:"マンチェスター・ユナイテッドは、英フィンテック企業SumUpと複数年の袖スポンサー契約を締結したと発表した。ロゴは男子・女子トップチームおよびアカデミーの全大会用ユニフォームに掲出され、共同ブランドの決済カードも提供される。新スポンサーは9月10日のチャンピオンズリーグ・サバー戦から袖に登場し、前スポンサーのDXCテクノロジーから引き継ぐ形となった。"},
        es:{title:"Manchester United firma un patrocinio de manga con la fintech SumUp", summary:"El Manchester United ha anunciado un acuerdo plurianual de patrocinio de manga con la fintech británica SumUp, cuya marca aparecerá en las camisetas masculina, femenina y de la academia en todas las competiciones. La alianza incluye también una tarjeta de pago cobranded con recompensas en tiendas del club y comercios del Reino Unido, y el patrocinador debutará el 10 de septiembre en el partido de Champions League ante el Sabah, sustituyendo al saliente DXC Technology."},
        zh:{title:"曼联与金融科技公司SumUp签署袖标赞助协议", summary:"曼联宣布与英国金融科技公司SumUp达成多年期袖标赞助协议,该品牌标志将出现在男女一线队及青训队各项赛事球衣上。此次合作还包括联名支付卡,可在俱乐部门店及英国商户享受奖励,新赞助商将于9月10日对阵萨巴赫的欧冠比赛中首次亮相,接替此前的DXC Technology。"},
        fr:{title:"Manchester United signe un sponsoring de manche avec la fintech SumUp", summary:"Manchester United a annoncé un accord pluriannuel de sponsoring de manche avec la fintech britannique SumUp, dont la marque apparaîtra sur les maillots masculins, féminins et de l'académie dans toutes les compétitions. Le partenariat inclut aussi une carte de paiement co-brandée offrant des avantages dans les boutiques du club et chez des commerçants britanniques, le sponsor faisant ses débuts le 10 septembre lors du match de Ligue des champions contre Sabah, en remplacement de DXC Technology."},
      }},
    {id:"mercedes-benz-stadium-mini-halo-board", sport:"football", region:"global", topics:["tech","stadium"], published_at:"2026-09-02T12:00:00Z",
      source_name:"Stadium Tech Report", source_url:"https://stadiumtechreport.com/news/top-stories-from-week-ending-9-4-26/",
      i18n:{
        en:{title:"Mercedes-Benz Stadium Adds Mini Halo Board to Control Room", summary:"Mercedes-Benz Stadium in Atlanta has installed a scaled-down replica of its signature 360-degree Halo Board inside its control room, letting production staff preview content in the display's unusual curved format before it goes live. The addition, part of a broader technology refresh at the nine-year-old venue, comes alongside two new software-defined production engines."},
        ja:{title:"メルセデス・ベンツ・スタジアム、コントロールルームに小型ハローボードを設置", summary:"アトランタのメルセデス・ベンツ・スタジアムは、名物の360度型大型ビジョン「ハローボード」の縮小レプリカをコントロールルームに新設した。制作スタッフが特殊な湾曲フォーマットの映像を本番送出前にプレビューできるようにする狙いで、開場9年目を迎えた同スタジアムの技術刷新の一環として、ソフトウェア定義型の映像制作エンジン2台も新たに導入された。"},
        es:{title:"El Mercedes-Benz Stadium instala una mini réplica del Halo Board en su sala de control", summary:"El Mercedes-Benz Stadium de Atlanta ha instalado una réplica a escala reducida de su emblemático Halo Board de 360 grados dentro de su sala de control, permitiendo al equipo de producción previsualizar el contenido en ese formato curvo inusual antes de emitirlo en directo. La incorporación, parte de una renovación tecnológica más amplia en el recinto de nueve años, llega junto a dos nuevos motores de producción definidos por software."},
        zh:{title:"梅赛德斯-奔驰体育场在控制室加装迷你环形大屏", summary:"亚特兰大梅赛德斯-奔驰体育场在其控制室内安装了标志性360度环形大屏“Halo Board”的缩小复制版,方便制作团队在正式播出前预览这种特殊弧形画面格式的内容。此举是这座启用九年的场馆更广泛技术升级的一部分,同时还新增了两套软件定义制作引擎。"},
        fr:{title:"Le Mercedes-Benz Stadium ajoute une mini réplique du Halo Board dans sa régie", summary:"Le Mercedes-Benz Stadium d'Atlanta a installé dans sa régie une réplique miniature de son emblématique écran panoramique à 360 degrés, le Halo Board, permettant à l'équipe de production de prévisualiser le contenu dans ce format incurvé inhabituel avant diffusion. Cet ajout, qui s'inscrit dans une modernisation technologique plus large du site âgé de neuf ans, s'accompagne de deux nouveaux moteurs de production définis par logiciel."},
      }},
    {id:"gamesquare-nasdaq-compliance-regained", sport:"esports", region:"global", topics:["biz"], published_at:"2026-09-05T12:00:00Z",
      source_name:"The Esports Radar", source_url:"https://esportsradar.gg/faze-owner-gamesquare-regains-compliance-with-nasdaqs-minimum-bid-requirement/",
      i18n:{
        en:{title:"Esports Firm GameSquare Averts Nasdaq Delisting via Reverse Stock Split", summary:"GameSquare Holdings, parent of esports org FaZe Clan, has cleared Nasdaq's minimum bid-price requirement after completing a shareholder-approved 1-for-8 reverse stock split. Shares held above $1 from Aug. 24 through Sept. 4, letting the company beat its Sept. 7 compliance deadline, though a delisting determination would follow immediately if the stock dips below $1 again within a year."},
        ja:{title:"eスポーツ大手GameSquare、株式併合でナスダック上場廃止リスクを回避", summary:"「FaZe Clan」を傘下に持つGameSquare Holdingsは、株主総会で承認された8対1の株式併合を実施し、最低株価要件を満たしてナスダック上場廃止のリスクを回避した。株価は2026年8月24日から9月4日まで1ドルを上回る水準を維持し、コンプライアンス期限の9月7日をクリアした。ただし今後1年以内に再び1ドルを下回った場合は猶予なく上場廃止決定が下される。"},
        es:{title:"La firma de esports GameSquare evita su exclusión de Nasdaq con un contrasplit de acciones", summary:"GameSquare Holdings, matriz de la organización de esports FaZe Clan, ha cumplido el requisito de precio mínimo de Nasdaq tras completar un contrasplit de acciones de 1 por 8 aprobado por los accionistas. Las acciones se mantuvieron por encima de $1 del 24 de agosto al 4 de septiembre, permitiendo a la empresa cumplir su plazo del 7 de septiembre, aunque una nueva caída por debajo de $1 en el próximo año provocaría de inmediato una decisión de exclusión."},
        zh:{title:"电竞公司GameSquare通过股票合并避免纳斯达克退市", summary:"电竞战队FaZe Clan母公司GameSquare Holdings完成股东批准的1股合8股并股后,已满足纳斯达克最低股价要求。公司股价自8月24日至9月4日维持在1美元以上,得以在9月7日合规截止日前达标,但若一年内股价再度跌破1美元,将立即触发退市裁定。"},
        fr:{title:"L'entreprise d'esport GameSquare évite la radiation du Nasdaq via un regroupement d'actions", summary:"GameSquare Holdings, maison mère de l'organisation esport FaZe Clan, a satisfait à l'exigence de prix plancher du Nasdaq après avoir réalisé un regroupement d'actions de 1 pour 8 approuvé par les actionnaires. L'action est restée au-dessus de 1 $ du 24 août au 4 septembre, permettant à l'entreprise de respecter son échéance de conformité du 7 septembre, bien qu'une radiation serait immédiatement prononcée si le titre repassait sous 1 $ dans l'année."},
      }},
    {id:"intel-mclaren-f1-compute-partnership", sport:"motorsports", region:"global", topics:["sponsor","tech"], published_at:"2026-05-14T12:00:00Z",
      source_name:"Intel Newsroom", source_url:"https://newsroom.intel.com/corporate/intel-named-official-compute-partner-of-mclaren-racing",
      i18n:{
        en:{title:"Intel Returns to F1 After 17 Years in McLaren Compute Partnership", summary:"Chipmaker Intel has signed a multi-year deal to become Official Compute Partner of McLaren Racing, marking its return to Formula 1 after 17 years since its last partnership with BMW Sauber ended in 2009. Intel's Xeon and Core Ultra processors will power McLaren's aerodynamic analysis, vehicle-dynamics simulation and race-strategy work, with branding extending to the team's IndyCar and sim-racing programs as well."},
        ja:{title:"インテル、17年ぶりにF1復帰 マクラーレンとコンピューティング契約", summary:"半導体大手インテルは、マクラーレン・レーシングの「オフィシャル・コンピュート・パートナー」として複数年契約を締結し、2009年のBMWザウバーとの契約終了以来17年ぶりにF1へ復帰した。XeonおよびCore Ultraプロセッサーが空力解析や車両ダイナミクスのシミュレーション、レース戦略分析などを支える。ロゴはF1のマクラーレン・マスターカード・チームに加え、インディカーのアロー・マクラーレン、Sim Racingチームにも展開される。"},
        es:{title:"Intel regresa a la F1 tras 17 años con una alianza informática con McLaren", summary:"El fabricante de chips Intel ha firmado un acuerdo plurianual para convertirse en Socio Informático Oficial de McLaren Racing, marcando su regreso a la Fórmula 1 17 años después de que terminara su última alianza con BMW Sauber en 2009. Los procesadores Xeon y Core Ultra de Intel impulsarán el análisis aerodinámico, la simulación de dinámica del vehículo y la estrategia de carrera de McLaren, y la marca se extenderá también a los programas de IndyCar y sim racing del equipo."},
        zh:{title:"英特尔时隔17年重返F1,与迈凯伦达成计算合作", summary:"芯片制造商英特尔已签署多年期协议,成为迈凯伦车队官方计算合作伙伴,这是自2009年与宝马索伯合作结束以来,英特尔时隔17年重返F1赛场。英特尔至强及酷睿Ultra处理器将支持迈凯伦的空气动力学分析、整车动态模拟及比赛策略研究,合作品牌标识也将延伸至该车队的IndyCar及模拟赛车项目。"},
        fr:{title:"Intel revient en F1 après 17 ans via un partenariat informatique avec McLaren", summary:"Le fabricant de puces Intel a signé un accord pluriannuel pour devenir Partenaire Informatique Officiel de McLaren Racing, marquant son retour en Formule 1 dix-sept ans après la fin de son dernier partenariat avec BMW Sauber en 2009. Les processeurs Xeon et Core Ultra d'Intel alimenteront les analyses aérodynamiques, les simulations de dynamique du véhicule et les travaux de stratégie de course de McLaren, la marque s'étendant aussi aux programmes IndyCar et sim-racing de l'écurie."},
      }},
    {id:"pirelli-f1-tyre-deal-2028", sport:"motorsports", region:"global", topics:["sponsor"], published_at:"2026-06-11T12:00:00Z",
      source_name:"Formula1.com", source_url:"https://www.formula1.com/en/latest/article/formula-1-and-fia-announce-extension-of-pirellis-global-tyre-partnership-through-2028.7zmagtUQMH0KGPsvBcIqAF",
      i18n:{
        en:{title:"Pirelli Extends F1 Tyre Supply Deal Through 2028", summary:"The FIA and Formula 1 have confirmed a one-year extension of Pirelli's exclusive tyre supply contract through the 2028 season, activating an option clause built into the 2023 agreement that originally covered 2025-27. Pirelli remains sole tyre supplier across F1, F2 and F3 under the extended deal."},
        ja:{title:"ピレリ、F1タイヤ供給契約を2028年まで延長", summary:"FIAとフォーミュラ1は、ピレリとの単独タイヤ供給契約を1年延長し、2028年シーズンまでとすることで合意したと発表した。2023年に締結した2025〜27年契約に盛り込まれていたオプション条項を発動する形で、F1、F2、F3の全カテゴリーで独占供給契約が継続される。"},
        es:{title:"Pirelli amplía su contrato de suministro de neumáticos en la F1 hasta 2028", summary:"La FIA y la Fórmula 1 han confirmado una prórroga de un año del contrato exclusivo de suministro de neumáticos de Pirelli hasta la temporada 2028, activando una cláusula de opción incluida en el acuerdo de 2023 que cubría originalmente 2025-27. Pirelli sigue siendo el único proveedor de neumáticos en F1, F2 y F3 bajo el contrato ampliado."},
        zh:{title:"倍耐力将F1轮胎供应合约延长至2028赛季", summary:"国际汽联与F1官方确认,倍耐力独家轮胎供应合约延长一年至2028赛季,启用了2023年协议中原本覆盖2025-27赛季的选择权条款。根据延长后的合约,倍耐力将继续担任F1、F2及F3的唯一轮胎供应商。"},
        fr:{title:"Pirelli prolonge son contrat de fourniture de pneus en F1 jusqu'en 2028", summary:"La FIA et la Formule 1 ont confirmé une prolongation d'un an du contrat exclusif de fourniture de pneus de Pirelli jusqu'à la saison 2028, activant une clause d'option intégrée à l'accord de 2023 qui couvrait initialement 2025-27. Pirelli reste fournisseur unique de pneus en F1, F2 et F3 dans le cadre de ce contrat prolongé."},
      }},
    {id:"premier-league-record-summer-spending-2026", sport:"soccer", region:"global", topics:["biz"], published_at:"2026-09-02T12:00:00Z",
      source_name:"Sports Illustrated", source_url:"https://www.si.com/soccer/premier-league-transfers-total-money-spent-2026-summer-window",
      i18n:{
        en:{title:"Premier League Clubs Smash Transfer Record With $4.75B Summer Spend", summary:"Premier League clubs spent a combined $4.75 billion (£3.5bn) in the 2026 summer transfer window, breaking last year's record for the second straight year. Manchester City topped the spending table at roughly $609 million, followed by Chelsea and Tottenham, with 11 clubs setting individual transfer records — including City's $168.8 million (£125m) purchase of Enzo Fernández, matching the British transfer record."},
        ja:{title:"プレミアリーグ、2026年夏の移籍市場で過去最高の47.5億ドルを投資", summary:"プレミアリーグ20クラブは2026年夏の移籍市場で総額約35.5億ポンド(47.5億ドル)を投じ、前年の記録を更新して2年連続で過去最高を塗り替えた。マンチェスター・シティが約6億ドルでトップに立ち、チェルシー、トッテナムが続いた。11クラブがクラブ史上最高額の移籍を記録し、シティによるエンソ・フェルナンデス獲得(1億2500万ポンド)は英国移籍記録に並ぶ規模となった。"},
        es:{title:"Los clubes de la Premier League baten el récord de fichajes con un gasto veraniego de $4.750M", summary:"Los clubes de la Premier League gastaron en conjunto $4.750M (£3.500M) en el mercado de fichajes de verano de 2026, superando el récord del año anterior por segundo año consecutivo. El Manchester City encabezó el gasto con unos $609M, seguido de Chelsea y Tottenham, y 11 clubes marcaron récords propios de fichajes — incluida la compra de Enzo Fernández por parte del City por $168,8M (£125M), que iguala el récord británico de traspasos."},
        zh:{title:"英超2026年夏窗转会支出达47.5亿美元,创历史新高", summary:"英超20家俱乐部在2026年夏季转会窗口合计投入约35.5亿英镑(合47.5亿美元),连续第二年刷新历史纪录。曼城以约6.09亿美元支出高居榜首,切尔西、热刺紧随其后,共有11家俱乐部刷新各自队史转会纪录,其中曼城以1.688亿美元(1.25亿英镑)引进恩佐·费尔南德斯,追平英国转会纪录。"},
        fr:{title:"La Premier League pulvérise son record de transferts avec 4,75 Md$ dépensés cet été", summary:"Les clubs de Premier League ont dépensé au total 4,75 Md$ (3,5 Md£) lors du mercato estival 2026, battant le record de l'an dernier pour la deuxième année consécutive. Manchester City arrive en tête des dépenses avec environ 609 M$, suivi de Chelsea et Tottenham, 11 clubs ayant établi leur propre record de transfert — dont l'achat d'Enzo Fernández par City pour 168,8 M$ (125 M£), égalant le record britannique de transfert."},
      }},
    {id:"uniqlo-bleague-partnership-2026", sport:"basketball", region:"japan", topics:["sponsor","fan"], published_at:"2026-09-01T12:00:00Z",
      source_name:"UNIQLO", source_url:"https://www.uniqlo.com/jp/ja/contents/corp/press-release/2026/09/bleague_b_2027bleagueutme5593.html",
      i18n:{
        en:{title:"Uniqlo Signs First Basketball Partnership With Japan's B.League", summary:"Uniqlo announced a new partnership with Japan's B.League on Sept. 1, marking the retailer's first foray into basketball apparel. Starting this month it will supply referee and table-official uniforms, and it will provide its first-ever basketball uniforms for the January 2027 B.League All-Star Game, while also expanding its UTme! custom-apparel service featuring all 55 clubs' logos from 37 to 94 stores."},
        ja:{title:"ユニクロ、Bリーグと初のバスケットボール分野パートナーシップ契約", summary:"ユニクロは9月1日、B.LEAGUEとパートナーシップ契約を締結したと発表した。9月から審判・テーブルオフィシャルズ向けウェアを提供するほか、2027年1月の「りそなグループBリーグオールスター」ではユニクロ初となるバスケットボール用ユニフォームを供給する。全55クラブのロゴ入りグッズを作れる「UTme!」の対応店舗も37店から94店に拡大した。"},
        es:{title:"Uniqlo firma su primera alianza de baloncesto con la B.League de Japón", summary:"Uniqlo anunció el 1 de septiembre una nueva alianza con la B.League de Japón, su primera incursión en ropa de baloncesto. Desde este mes suministrará las equipaciones de árbitros y oficiales de mesa, y vestirá por primera vez el All-Star Game de la B.League en enero de 2027, además de ampliar su servicio de personalización UTme!, con los logos de los 55 clubes, de 37 a 94 tiendas."},
        zh:{title:"优衣库与日本B联赛签署首份篮球领域合作协议", summary:"优衣库9月1日宣布与日本B联赛达成新合作,这是该零售商首次涉足篮球服饰领域。自本月起将提供裁判及记录台官员服装,并将在2027年1月的B联赛全明星赛上首次供应篮球比赛服;同时把可定制全部55家俱乐部队徽的“UTme!”服务门店数从37家扩大至94家。"},
        fr:{title:"Uniqlo signe son premier partenariat basket avec la B.League japonaise", summary:"Uniqlo a annoncé le 1er septembre un nouveau partenariat avec la B.League japonaise, marquant sa première incursion dans l'habillement basket. Dès ce mois-ci, la marque fournira les tenues des arbitres et officiels de table, et habillera pour la première fois le All-Star Game de la B.League en janvier 2027, tout en étendant son service de personnalisation UTme!, qui propose les logos des 55 clubs, de 37 à 94 boutiques."},
      }},
    {id:"hisense-bleague-official-sponsor-2026-27", sport:"basketball", region:"japan", topics:["sponsor","tech"], published_at:"2026-07-31T12:00:00Z",
      source_name:"Kyodo News", source_url:"https://b.kyodo.co.jp/business/2026-07-31_8447927/",
      i18n:{
        en:{title:"China's Hisense Becomes Official B.League Sponsor, to Supply LED Displays Leaguewide", summary:"Hisense Japan, the local arm of the Chinese electronics maker, has become an official sponsor of Japan's B.League starting with the 2026-27 season that tips off Sept. 22. The deal includes supplying LED video panels to all 26 top-division arenas, alongside promotional campaigns run through electronics retailers and online channels, as the league — now in its tenth season with attendance more than double its founding levels — continues an aggressive expansion push."},
        ja:{title:"中国ハイセンス、Bリーグの公式スポンサーに 全アリーナへLEDビジョン供給へ", summary:"中国の家電大手ハイセンスの日本法人は、9月22日開幕のBリーグ2026-27シーズンから公式スポンサーに就任すると発表した。B1全26アリーナにLEDビジョンパネルを供給するほか、家電量販店やオンラインでのプロモーション施策も展開する。開幕10年目を迎えるBリーグは観客動員が発足時の倍以上に伸びており、積極的な事業拡大局面にあるとされる。"},
        es:{title:"La china Hisense se convierte en patrocinador oficial de la B.League y suministrará pantallas LED a toda la liga", summary:"Hisense Japan, la filial local del fabricante chino de electrónica, se ha convertido en patrocinador oficial de la B.League japonesa desde la temporada 2026-27, que arranca el 22 de septiembre. El acuerdo incluye el suministro de paneles de vídeo LED a los 26 pabellones de primera división, junto con campañas promocionales en tiendas de electrónica y canales online, mientras la liga — que celebra su décima temporada con una asistencia más del doble que en sus inicios — mantiene su fuerte impulso de expansión."},
        zh:{title:"中国海信成为B联赛官方赞助商,将为全联盟供应LED显示屏", summary:"中国家电制造商海信的日本子公司已成为日本B联赛官方赞助商,合作自9月22日开幕的2026-27赛季开始。协议包括为B1联赛全部26座场馆供应LED视频显示屏,并通过家电零售商及线上渠道展开推广活动。B联赛迎来创立第十个赛季,现场观赛人数已较创立初期翻倍以上,联盟仍在积极推进扩张。"},
        fr:{title:"Le chinois Hisense devient sponsor officiel de la B.League et fournira des écrans LED à toute la ligue", summary:"Hisense Japan, filiale locale du fabricant électronique chinois, est devenu sponsor officiel de la B.League japonaise à partir de la saison 2026-27, dont le coup d'envoi est prévu le 22 septembre. L'accord prévoit la fourniture d'écrans vidéo LED aux 26 salles de première division, ainsi que des campagnes promotionnelles menées via des enseignes d'électronique et des canaux en ligne, alors que la ligue — qui entame sa dixième saison avec une affluence plus de deux fois supérieure à ses débuts — poursuit une expansion soutenue."},
      }},
    {id:"la-angels-kroenke-sale", sport:"baseball", region:"global", topics:["team","biz"], published_at:"2026-09-01T12:00:00Z",
      source_name:"Washington Times", source_url:"https://www.washingtontimes.com/news/2026/sep/1/mlbs-los-angeles-angels-sold-la-rams-arsenal-owner-stan-kroenke/",
      i18n:{
        en:{title:"Angels Sold to Rams, Arsenal Owner Stan Kroenke in Priciest MLB Deal Ever", summary:"The Los Angeles Angels have been sold to Stan Kroenke — who already owns the NFL's Rams, Premier League champions Arsenal, the NBA's Nuggets, the NHL's Avalanche and MLS's Rapids — in a deal that includes the team's regional TV and radio outlets. It's the most expensive sale in MLB history and caps a summer that has also seen the Lakers, Timberwolves and Seahawks change hands."},
        ja:{title:"エンゼルス売却、ラムズ・アーセナルのオーナーが取得 MLB史上最高額に", summary:"ロサンゼルス・エンゼルスが、NFLラムズやプレミアリーグ王者アーセナル、NBAナゲッツ、NHLアバランチ、MLSラピッズを保有するスタン・クロンキ氏に売却された。地元テレビ・ラジオ局の権利も含む取引で、MLB史上最高額の球団売却となった。この夏はレイカーズ、ティンバーウルブズ、シーホークスも所有者が交代しており、球団売却が相次いでいる。"},
        es:{title:"Los Angels vendidos a Stan Kroenke, dueño de Rams y Arsenal, en el mayor traspaso de la historia de la MLB", summary:"Los Angeles Angels han sido vendidos a Stan Kroenke — que ya posee a los Rams de la NFL, al Arsenal campeón de la Premier League, a los Nuggets de la NBA, al Avalanche de la NHL y al Rapids de la MLS — en un acuerdo que incluye la cadena regional de TV y la radio del equipo. Es la venta más cara en la historia de la MLB y cierra un verano que también vio cambiar de manos a Lakers, Timberwolves y Seahawks."},
        zh:{title:"天使队售予拥有公羊、阿森纳的克伦克,创MLB史上最高售价", summary:"洛杉矶天使队已出售给已拥有NFL公羊队、英超冠军阿森纳、NBA掘金队、NHL雪崩队及MLS落基山队的斯坦·克伦克,交易包含球队的地方电视和广播权益,成为MLB历史上最高价的球队交易。此前这个夏天湖人、森林狼和海鹰队也相继易主。"},
        fr:{title:"Les Angels vendus à Stan Kroenke, propriétaire des Rams et d'Arsenal, plus grosse vente de l'histoire de la MLB", summary:"Les Angels de Los Angeles ont été vendus à Stan Kroenke — qui possède déjà les Rams en NFL, le champion de Premier League Arsenal, les Nuggets en NBA, l'Avalanche en NHL et le Rapids en MLS — dans un accord incluant les chaînes de télévision et de radio régionales de l'équipe. Il s'agit de la vente la plus chère de l'histoire de la MLB, à l'issue d'un été qui a aussi vu les Lakers, les Timberwolves et les Seahawks changer de mains."},
      }},
    {id:"lakers-kushner-iger-record-sale", sport:"basketball", region:"global", topics:["team","biz"], published_at:"2026-08-13T12:00:00Z",
      source_name:"ESPN", source_url:"https://www.espn.com/nba/story/_/id/49590362/josh-kushner-bob-iger-buy-lakers-12b",
      i18n:{
        en:{title:"Lakers Sold to Josh Kushner, Bob Iger for Record $12.5 Billion", summary:"The Los Angeles Lakers are being sold to Josh Kushner and Bob Iger for $12.5 billion — the highest price ever paid for any sports team — less than a year after Mark Walter bought the franchise from the Buss family at a then-record $10 billion valuation. The Buss family will retain a 15% stake, with Jeanie Buss continuing as governor."},
        ja:{title:"レイカーズ売却、コシュナー氏とアイガー氏に125億ドルで スポーツ史上最高額", summary:"ロサンゼルス・レイカーズが、ジョシュ・コシュナー氏とボブ・アイガー氏に125億ドルで売却されることになった。マーク・ウォルター氏がバス家から当時史上最高額の100億ドルで買収してから1年足らずでの再売却となる。スポーツチーム売却として史上最高額。バス家は15%の株式を保持し、ジーニー・バス氏がガバナーを続投する。"},
        es:{title:"Lakers vendidos a Josh Kushner y Bob Iger por un récord de $12.500M", summary:"Los Angeles Lakers están siendo vendidos a Josh Kushner y Bob Iger por $12.500M — el precio más alto jamás pagado por un equipo deportivo — menos de un año después de que Mark Walter comprara la franquicia a la familia Buss por entonces récord de $10.000M. La familia Buss conservará un 15% y Jeanie Buss seguirá como gobernadora."},
        zh:{title:"湖人队以125亿美元创纪录售予库什纳与艾格", summary:"洛杉矶湖人队将以125亿美元售予乔希·库什纳与鲍勃·艾格,创下体育队史上最高交易金额纪录。此前马克·沃尔特刚以当时创纪录的100亿美元从巴斯家族手中购得球队,不到一年便再度易主。巴斯家族将保留15%股份,珍妮·巴斯将继续担任球队治理人。"},
        fr:{title:"Les Lakers vendus à Josh Kushner et Bob Iger pour un record de 12,5 Md$", summary:"Les Lakers de Los Angeles sont vendus à Josh Kushner et Bob Iger pour 12,5 Md$ — le prix le plus élevé jamais payé pour une équipe sportive — moins d'un an après que Mark Walter a racheté la franchise à la famille Buss pour un montant alors record de 10 Md$. La famille Buss conservera 15 % des parts, Jeanie Buss restant gouverneure de l'équipe."},
      }},
    {id:"spurs-dazn-streaming-deal", sport:"basketball", region:"global", topics:["tech","biz"], published_at:"2026-09-02T12:00:00Z",
      source_name:"Sports Video Group", source_url:"https://www.sportsvideo.org/2026/09/02/san-antonio-spurs-name-dazn-exclusive-streaming-home-beginning-2026-27-season/",
      i18n:{
        en:{title:"Spurs Become Fourth NBA Team to Go DAZN-Exclusive for Local Streaming", summary:"The San Antonio Spurs have named DAZN their exclusive direct-to-consumer streaming home starting in 2026-27, covering all non-nationally-televised games plus preseason action from $19.99 a month. San Antonio joins the Cavaliers, Timberwolves and Pacers as the fourth NBA team to move local broadcasts fully to DAZN, with an exit clause once the league's own centralized local-rights hub launches."},
        ja:{title:"スパーズ、地方配信をDAZN独占へ NBA4球団目", summary:"サンアントニオ・スパーズは2026-27シーズンから、地上波未放送の全試合とプレシーズンをDAZNで独占配信すると発表した。月額19.99ドルから視聴可能。キャバリアーズ、ティンバーウルブズ、ペイサーズに続き、地方放送を全面的にDAZNへ移行するNBA4球団目となる。NBAが独自の一元的ローカル配信基盤を立ち上げた際の解約条項も設けられている。"},
        es:{title:"Spurs, cuarto equipo de la NBA en pasar en exclusiva a DAZN para el streaming local", summary:"Los San Antonio Spurs han nombrado a DAZN su plataforma exclusiva de streaming directo al consumidor desde 2026-27, cubriendo todos los partidos no televisados a nivel nacional además de la pretemporada, desde $19,99 al mes. San Antonio se une a Cavaliers, Timberwolves y Pacers como el cuarto equipo de la NBA en trasladar por completo su emisión local a DAZN, con una cláusula de salida cuando la liga lance su propio centro centralizado de derechos locales."},
        zh:{title:"马刺成为NBA第四支全面转投DAZN本地流媒体独家转播的球队", summary:"圣安东尼奥马刺队宣布,自2026-27赛季起将DAZN定为独家直接面向消费者的流媒体转播平台,覆盖所有未在全国电视转播的常规赛及季前赛,套餐月费19.99美元起。继骑士、森林狼和步行者之后,马刺成为第四支将地方转播全面转移至DAZN的NBA球队,协议中设有NBA若推出自有集中式地方版权平台时的退出条款。"},
        fr:{title:"Les Spurs, quatrième équipe NBA à passer en exclusivité chez DAZN pour le streaming local", summary:"Les Spurs de San Antonio ont désigné DAZN comme leur plateforme exclusive de streaming direct au consommateur à partir de 2026-27, couvrant tous les matchs non diffusés nationalement ainsi que la présaison, dès 19,99 $ par mois. San Antonio rejoint les Cavaliers, les Timberwolves et les Pacers comme quatrième équipe NBA à transférer entièrement sa diffusion locale vers DAZN, avec une clause de sortie une fois que la ligue lancera sa propre plateforme centralisée de droits locaux."},
      }},
    {id:"esports-world-cup-2026-record-prize-pool", sport:"esports", region:"global", topics:["biz","sponsor"], published_at:"2026-08-23T12:00:00Z",
      source_name:"GamesBeat", source_url:"https://gamesbeat.com/esports-world-cup-2026-prize-pool-will-be-75m/",
      i18n:{
        en:{title:"Esports World Cup 2026 Wraps With a Record $75 Million Prize Pool", summary:"The 2026 Esports World Cup in Riyadh — 25 tournaments across 24 games over seven weeks, drawing more than 2,000 players and 200 clubs from over 100 countries — paid out a record $75 million in prizes, up from just over $70 million in 2025. The winning club alone took home $7 million, part of a $30 million Club Championship pool."},
        ja:{title:"eスポーツ・ワールドカップ2026、賞金総額7500万ドルの過去最高額で閉幕", summary:"サウジアラビア・リヤドで開催された2026年eスポーツ・ワールドカップは、7週間にわたり24タイトル・25大会を実施し、100カ国超から2000人以上の選手・200クラブが参加した。賞金総額は過去最高の7500万ドルとなり、2025年の約7000万ドルから増加した。優勝クラブには単独で700万ドルが贈られ、クラブ選手権全体の賞金総額は3000万ドルに上る。"},
        es:{title:"La Esports World Cup 2026 cierra con un récord de $75 millones en premios", summary:"La Esports World Cup 2026 en Riad — 25 torneos en 24 juegos a lo largo de siete semanas, con más de 2.000 jugadores y 200 clubes de más de 100 países — repartió un récord de $75 millones en premios, frente a poco más de $70 millones en 2025. El club campeón se llevó por sí solo $7 millones, dentro de una bolsa de $30 millones para el Club Championship."},
        zh:{title:"2026电竞世界杯落幕,奖金总额7500万美元创新高", summary:"在沙特利雅得举办的2026电竞世界杯历时七周,涵盖24款游戏共25项赛事,吸引超过100个国家的2000多名选手和200支俱乐部参赛。赛事奖金总额达创纪录的7500万美元,较2025年的逾7000万美元有所增长。夺冠俱乐部单独获得700万美元奖金,俱乐部锦标赛奖金池总额达3000万美元。"},
        fr:{title:"L'Esports World Cup 2026 se termine avec une cagnotte record de 75 millions de dollars", summary:"L'Esports World Cup 2026 à Riyad — 25 tournois sur 24 jeux pendant sept semaines, réunissant plus de 2 000 joueurs et 200 clubs de plus de 100 pays — a distribué une cagnotte record de 75 millions de dollars, contre un peu plus de 70 millions en 2025. Le club vainqueur a remporté à lui seul 7 millions de dollars, dans le cadre d'une cagnotte de 30 millions de dollars pour le Club Championship."},
      }},
    {id:"fifa-worldcup-betano-gambling-sponsor", sport:"soccer", region:"global", topics:["sponsor"], published_at:"2026-05-18T12:00:00Z",
      source_name:"Yahoo Sports", source_url:"https://sports.yahoo.com/articles/fifa-signs-another-world-cup-130657478.html",
      i18n:{
        en:{title:"FIFA Signs Betano as Regional Gambling Sponsor of the 2026 World Cup", summary:"FIFA has signed Greek betting brand Betano, owned by Kaizen Gaming, as a regional sponsor of the 2026 World Cup covering Europe and South America. It's Betano's second World Cup partnership after serving as the tournament's first-ever betting sponsor in Qatar in 2022, and follows other 2026 deals with prediction-market and data providers."},
        ja:{title:"FIFA、2026年W杯の地域スポンサーにBetanoと契約 賭博系スポンサー", summary:"FIFAは、Kaizen Gaming傘下のギリシャの賭博ブランドBetanoと、欧州・南米地域を対象とした2026年ワールドカップのスポンサー契約を締結した。Betanoにとっては2022年カタール大会で史上初の賭博系スポンサーを務めて以来、2度目のW杯パートナーシップとなる。予測市場やデータ提供企業との契約に続く動きだ。"},
        es:{title:"La FIFA ficha a Betano como patrocinador regional de apuestas del Mundial 2026", summary:"La FIFA ha fichado a la marca griega de apuestas Betano, propiedad de Kaizen Gaming, como patrocinador regional del Mundial 2026 para Europa y Sudamérica. Es la segunda alianza mundialista de Betano tras ser el primer patrocinador de apuestas del torneo en Catar 2022, y llega después de otros acuerdos de 2026 con proveedores de mercados de predicción y de datos."},
        zh:{title:"国际足联签下Betano作为2026世界杯区域博彩赞助商", summary:"国际足联已与Kaizen Gaming旗下的希腊博彩品牌Betano签署赞助协议,担任2026年世界杯欧洲及南美地区的区域赞助商。这是Betano继2022年卡塔尔世界杯成为该赛事史上首个博彩类赞助商后,第二次与世界杯合作,此前国际足联还与预测市场及数据提供商达成过类似合作。"},
        fr:{title:"La FIFA signe Betano comme sponsor régional de paris pour la Coupe du monde 2026", summary:"La FIFA a signé la marque grecque de paris Betano, propriété de Kaizen Gaming, comme sponsor régional de la Coupe du monde 2026 pour l'Europe et l'Amérique du Sud. Il s'agit du deuxième partenariat mondial de Betano après avoir été le tout premier sponsor de paris du tournoi au Qatar en 2022, et fait suite à d'autres accords 2026 avec des fournisseurs de marchés prédictifs et de données."},
      }},
    {id:"jleague-stadium-projects-survey-2026", sport:"soccer", region:"japan", topics:["stadium"], published_at:"2026-09-01T12:00:00Z",
      source_name:"Sporting News Japan", source_url:"https://news.yahoo.co.jp/articles/40049a610f16dd1e6e45fafc52c62a7e1d2602ac",
      i18n:{
        en:{title:"27 Soccer Stadium Projects Underway Nationwide in Japan, but Few Past the Planning Stage", summary:"A Japan Sports Agency survey found 27 stadium and arena concepts nationwide with soccer (J.League, JFL or regional leagues) as a primary intended use, but only five have advanced to design or construction — including new stadiums for Montedio Yamagata (due 2028), Iwaki FC (2031) and a dedicated football stadium at Todoroki (2030)."},
        ja:{title:"全国27件のサッカースタジアム構想、設計・建設段階はわずか数件", summary:"スポーツ庁のまとめによると、Jリーグ・JFL・地域リーグなどサッカーを主たる想定コンテンツとするスタジアム・アリーナ構想は全国で27件にのぼるが、設計・建設段階に進んでいるのはモンテディオ山形新スタジアム(2028年完成予定)、いわきFC新スタジアム(2031年完成予定)、等々力緑地球技専用スタジアム(2030年完成予定)など数件にとどまっている。"},
        es:{title:"27 proyectos de estadios de fútbol en marcha en Japón, pero pocos superan la fase de planificación", summary:"Un estudio de la Agencia de Deportes de Japón identificó 27 proyectos de estadios y pabellones en todo el país con el fútbol (J.League, JFL o ligas regionales) como uso principal previsto, pero solo cinco han avanzado a la fase de diseño o construcción — incluidos nuevos estadios para Montedio Yamagata (previsto para 2028), Iwaki FC (2031) y un estadio de fútbol dedicado en Todoroki (2030)."},
        zh:{title:"日本全国27个足球场馆构想推进中,仅少数进入设计建设阶段", summary:"日本体育厅的调查显示,全国以足球(J联赛、JFL或地区联赛)为主要用途设想的场馆构想共有27个,但仅有5个已进入设计或建设阶段,包括山形蒙特迪奥新球场(预计2028年完工)、磐城FC新球场(2031年)以及等等力绿地专用足球场(2030年)等。"},
        fr:{title:"27 projets de stades de football en cours au Japon, mais peu dépassent le stade de la planification", summary:"Une étude de l'Agence des sports du Japon a recensé 27 projets de stades et d'arènes à travers le pays destinés principalement au football (J.League, JFL ou ligues régionales), mais seuls cinq ont atteint la phase de conception ou de construction — dont de nouveaux stades pour le Montedio Yamagata (prévu 2028), l'Iwaki FC (2031) et un stade dédié au football à Todoroki (2030)."},

        ja:{title:"サッカー日本代表のスポンサー、W杯を前に過去最多の43社に", summary:"日本サッカー協会(JFA)が支援企業を過去最多の43社まで拡大したことが分かった。このうち3分の1はここ3年以内に新たに参画した企業だという。キリンやANA、トヨタ自動車、みずほフィナンシャルグループといった長年のパートナーが中核を担う一方、JFAは少数の大型契約に頼らない地道な「草の根」営業がこの拡大を支えたとしている。"},

  ];

  const SPORT_KEYS = ["all","soccer","baseball","basketball","football","olympics","esports","motorsports","general"];
  const TOPIC_KEYS = ["team","tech","stadium","fan","sponsor","biz"];

  let lang = DEFAULT_LANG;
  try{
    const saved = localStorage.getItem("stadiumwire_lang");
    if (saved && LANGS.includes(saved)) lang = saved;
  }catch(e){}

  const state = { sport:"all", topics:new Set(), region:null, query:"", pageSize:60 };

  function t(){ return UI[lang]; }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function relTime(iso){
    const ts = t();
    const time = new Date(iso).getTime();
    if (isNaN(time)) return "";
    const diffMs = Date.now()-time;
    const min = Math.floor(diffMs/60000);
    if (min < 1) return ts.just_now;
    if (min < 60) return ts.min_ago(min);
    const hr = Math.floor(min/60);
    if (hr < 24) return ts.hr_ago(hr);
    const day = Math.floor(hr/24);
    if (day < 30) return ts.day_ago(day);
    const month = Math.floor(day/30);
    if (month < 12) return ts.mo_ago(month);
    return ts.yr_ago(Math.floor(month/12));
  }

  function sourceArticles(){
    return ARTICLES_DATA.slice().sort((a,b)=> new Date(b.published_at) - new Date(a.published_at));
  }

  function articleText(a, field){
    return (a.i18n[lang] && a.i18n[lang][field]) || (a.i18n.en && a.i18n.en[field]) || "";
  }

  function renderTally(all){
    const ts = t();
    const counts = {all: all.length, japan: 0};
    SPORT_KEYS.forEach(k=>{ if(k!=="all") counts[k]=0; });
    all.forEach(a=>{
      counts[a.sport] = (counts[a.sport]||0)+1;
      if (a.region==="japan") counts.japan++;
    });
    const el = document.getElementById("tally");
    el.innerHTML = SPORT_KEYS.map(k=>`
      <button class="tally-tile" data-sport="${k}" aria-pressed="${state.sport===k && state.region!=="japan"}">
        <span class="tally-label">${esc(ts.sports[k]||k)}</span>
        <span class="tally-count">${counts[k]||0}</span>
      </button>`).join("")
      + `<button class="tally-tile" id="japanTally" aria-pressed="${state.region==="japan"}">
        <span class="tally-label">${esc(ts.japan_tally)}</span>
        <span class="tally-count">${counts.japan}</span>
      </button>`;
    el.querySelectorAll(".tally-tile[data-sport]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ state.sport = btn.dataset.sport; state.region = null; render(); });
    });
    document.getElementById("japanTally").addEventListener("click", ()=>{
      state.region = "japan"; state.sport = "all"; render();
    });
  }

  function renderTopicChips(){
    const ts = t();
    const el = document.getElementById("topicChips");
    el.innerHTML = TOPIC_KEYS.map(k=>`
      <button class="chip" data-topic="${k}" aria-pressed="${state.topics.has(k)}">${esc(ts.topics[k]||k)}</button>`).join("")
      + `<button class="chip" id="clearTopics" style="border-style:dashed;">${esc(ts.reset)}</button>`;
    el.querySelectorAll(".chip[data-topic]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const k = btn.dataset.topic;
        if (state.topics.has(k)) state.topics.delete(k); else state.topics.add(k);
        render();
      });
    });
    document.getElementById("clearTopics").addEventListener("click", ()=>{
      state.sport="all"; state.topics.clear(); state.region=null; state.query="";
      document.getElementById("searchInput").value="";
      render();
    });
  }

  function matches(a){
    if (state.sport!=="all" && a.sport!==state.sport) return false;
    if (state.region && a.region!==state.region) return false;
    if (state.topics.size>0 && !a.topics.some(k=>state.topics.has(k))) return false;
    if (state.query){
      const hay = (articleText(a,"title")+" "+articleText(a,"summary")+" "+a.source_name).toLowerCase();
      if (!hay.includes(state.query.toLowerCase())) return false;
    }
    return true;
  }

  function cardHtml(a){
    const ts = t();
    const topicBadges = a.topics.map(k=>`<span class="badge-topic">${esc(ts.topics[k]||k)}</span>`).join("");
    return `
      <article class="card">
        <div class="card-top">
          <span class="badge-sport">${esc(ts.sports[a.sport]||a.sport)}</span>
          ${topicBadges}
        </div>
        <div class="title-main">${esc(articleText(a,"title"))}</div>
        <div class="summary-main">${esc(articleText(a,"summary"))}</div>
        <div class="card-foot">
          <span class="source-line"><b>${esc(a.source_name)}</b> ・ <span class="mono">${esc(relTime(a.published_at))}</span></span>
          <a class="read-link" href="${esc(a.source_url)}" target="_blank" rel="noopener noreferrer">${esc(ts.read_original)}</a>
        </div>
      </article>`;
  }

  function applyStaticText(){
    const ts = t();
    document.documentElement.lang = lang;
    document.getElementById("tagline").textContent = ts.tagline;
    document.getElementById("searchInput").placeholder = ts.search_ph;
    document.getElementById("loadMoreBtn").textContent = ts.load_more;
    document.getElementById("footerText").textContent = ts.footer;
    document.getElementById("langSelect").value = lang;
  }

  function render(){
    const ts = t();
    applyStaticText();
    const all = sourceArticles();
    renderTally(all);
    renderTopicChips();
    const filtered = all.filter(matches);
    const shown = filtered.slice(0, state.pageSize);

    const latest = all.reduce((m,a)=> !m || new Date(a.published_at)>new Date(m) ? a.published_at : m, null);
    document.getElementById("statusText").textContent = `${ts.updated(latest?relTime(latest):"—")} ・ ${ts.count(all.length)}`;
    document.getElementById("resultLine").textContent = ts.showing(shown.length, filtered.length);

    const japanBanner = document.getElementById("japanBanner");
    japanBanner.hidden = state.region!=="japan";
    if (state.region==="japan"){
      document.getElementById("japanBannerTitle").textContent = ts.japan_banner_title;
      document.getElementById("japanBannerSub").textContent = ts.japan_banner_sub;
    }

    const grid = document.getElementById("grid");
    grid.innerHTML = shown.length ? shown.map(cardHtml).join("") : `<div class="empty">${esc(ts.empty)}</div>`;

    const moreWrap = document.getElementById("loadMoreWrap");
    moreWrap.hidden = !(filtered.length > shown.length);
  }

  document.getElementById("searchInput").addEventListener("input", (e)=>{
    state.query = e.target.value;
    render();
  });
  document.getElementById("loadMoreBtn").addEventListener("click", ()=>{
    state.pageSize += 60;
    render();
  });
  document.getElementById("langSelect").addEventListener("change", (e)=>{
    lang = LANGS.includes(e.target.value) ? e.target.value : DEFAULT_LANG;
    try{ localStorage.setItem("stadiumwire_lang", lang); }catch(err){}
    render();
  });

  render();
  setInterval(render, 60000);
})();
</script>
