<title>Stadium Wire</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
  :root{
    --ink:#16181D;
    --ink-soft:#4B5262;
    --ink-faint:#818A99;
    --paper:#F2F4F3;
    --surface:#FFFFFF;
    --surface-2:#E7EAEB;
    --line:#DCE0E3;
    --navy:#122040;
    --navy-2:#1B2E54;
    --accent:#E3A008;
    --accent-text:#8A5A00;
    --live:#1E9E64;
    --shadow: 0 1px 2px rgba(18,32,64,0.06), 0 6px 20px rgba(18,32,64,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#E9EBF0;
      --ink-soft:#A6ADBB;
      --ink-faint:#6C7482;
      --paper:#0B0F17;
      --surface:#121826;
      --surface-2:#1A2233;
      --line:#252E40;
      --navy:#0B1220;
      --navy-2:#111A2E;
      --accent:#F0B429;
      --accent-text:#FFCB66;
      --live:#34D399;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --ink:#E9EBF0;
    --ink-soft:#A6ADBB;
    --ink-faint:#6C7482;
    --paper:#0B0F17;
    --surface:#121826;
    --surface-2:#1A2233;
    --line:#252E40;
    --navy:#0B1220;
    --navy-2:#111A2E;
    --accent:#F0B429;
    --accent-text:#FFCB66;
    --live:#34D399;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Noto Sans SC","IBM Plex Sans",sans-serif;
    line-height:1.6;
  }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--accent-text); outline-offset:2px; }

  .mono{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }

  /* ---------- header ---------- */
  header.site{
    background: linear-gradient(180deg, var(--navy), var(--navy-2));
    color:#F4F6FA;
    padding: 18px clamp(14px,3vw,32px) 16px;
  }
  .header-row{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand-name{
    font-family:"Anton",sans-serif;
    font-size:clamp(28px,4vw,40px);
    letter-spacing:0.5px;
    line-height:1;
    color:#F4F6FA;
  }
  .brand-name span{ color:var(--accent); }
  .brand-tagline{
    font-size:12.5px; color:#B9C2D4; letter-spacing:0.04em;
  }
  .status-cluster{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .live-pill{
    display:flex; align-items:center; gap:7px;
    font-size:12px; letter-spacing:0.08em; color:#CFE9DA;
    background:rgba(30,158,100,0.14);
    border:1px solid rgba(52,211,153,0.35);
    padding:5px 10px 5px 8px; border-radius:999px;
  }
  .live-dot{
    width:7px; height:7px; border-radius:50%; background:var(--live);
    box-shadow:0 0 0 0 rgba(52,211,153,0.6);
  }
  @media (prefers-reduced-motion:no-preference){
    .live-dot{ animation:pulse 2s ease-in-out infinite; }
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(52,211,153,0.55); }
    70%{ box-shadow:0 0 0 7px rgba(52,211,153,0); }
    100%{ box-shadow:0 0 0 0 rgba(52,211,153,0); }
  }
  .updated-text{ font-size:12.5px; color:#B9C2D4; }
  .updated-text b{ color:#F4F6FA; font-weight:600; }
  .lang-select{
    font:inherit; font-size:12.5px; font-weight:600;
    background:rgba(255,255,255,0.08); color:#F4F6FA;
    border:1px solid rgba(255,255,255,0.22); border-radius:7px;
    padding:6px 10px; cursor:pointer;
  }
  .lang-select:hover{ background:rgba(255,255,255,0.14); }
  .lang-select option{ color:#16181D; }

  /* ---------- scoreboard tally ---------- */
  .tally-wrap{
    background:var(--navy);
    border-top:1px solid rgba(255,255,255,0.06);
    overflow-x:auto;
  }
  .tally{
    display:flex; gap:1px; min-width:max-content;
    padding:0 clamp(14px,3vw,32px);
  }
  .tally-tile{
    all:unset; cursor:pointer;
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    padding:10px 16px 12px; min-width:92px;
    border-bottom:3px solid transparent;
    color:#C7D0E0;
  }
  .tally-tile:hover{ background:rgba(255,255,255,0.05); }
  .tally-tile[aria-pressed="true"]{
    border-bottom-color:var(--accent); color:#fff;
  }
  .tally-label{ font-size:11.5px; letter-spacing:0.03em; white-space:nowrap; }
  .tally-count{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:20px; font-weight:600; color:var(--accent); }
  .tally-tile[aria-pressed="true"] .tally-count{ color:#FFD873; }

  /* ---------- controls ---------- */
  .controls{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:16px clamp(14px,3vw,32px) 6px;
  }
  .chip{
    all:unset; cursor:pointer; font-size:13px;
    padding:7px 13px; border-radius:999px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  }
  .chip:hover{ border-color:var(--ink-faint); }
  .chip[aria-pressed="true"]{
    background:var(--accent); border-color:var(--accent); color:#241800; font-weight:600;
  }
  .japan-banner[hidden]{ display:none; }
  .japan-banner{
    display:flex; align-items:center; gap:14px;
    margin:6px clamp(14px,3vw,32px) 4px;
    padding:14px 18px;
    background:linear-gradient(135deg, #C8393F, #A32B31);
    border-radius:12px;
    box-shadow:var(--shadow);
  }
  .japan-banner-flag{ font-size:28px; line-height:1; }
  .japan-banner-title{ font-size:16px; font-weight:700; color:#fff; }
  .japan-banner-sub{ font-size:12.5px; color:rgba(255,255,255,0.85); margin-top:2px; }
  .search-box{
    margin-left:auto; position:relative; min-width:200px; flex:0 1 260px;
  }
  .search-box input{
    width:100%; font:inherit; font-size:13.5px;
    padding:9px 12px 9px 32px; border-radius:999px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
  }
  .search-box input::placeholder{ color:var(--ink-faint); }
  .search-box svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:0.55; }

  .result-line{
    padding:6px clamp(14px,3vw,32px) 4px; font-size:12.5px; color:var(--ink-faint);
  }

  /* ---------- grid ---------- */
  main{ padding:8px clamp(14px,3vw,32px) 40px; }
  .grid{
    display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:16px 17px 14px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px;
  }
  .card-top{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .badge-sport{
    font-size:11px; font-weight:700; letter-spacing:0.02em;
    background:var(--navy); color:var(--accent);
    padding:3px 9px; border-radius:5px;
  }
  .badge-topic{
    font-size:11px; color:var(--ink-soft);
    background:var(--surface-2); padding:3px 8px; border-radius:5px;
  }
  .title-main{ font-size:16.5px; font-weight:700; line-height:1.45; }
  .summary-main{ font-size:13.8px; color:var(--ink); }
  .card-foot{
    margin-top:auto; padding-top:10px; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
  }
  .source-line{ font-size:12px; color:var(--ink-faint); }
  .source-line b{ color:var(--ink-soft); font-weight:600; }
  .read-link{
    font-size:12.5px; font-weight:600; color:var(--accent-text);
    text-decoration:none; white-space:nowrap;
  }
  .read-link:hover{ text-decoration:underline; }

  .empty{
    grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--ink-faint); font-size:14px;
  }

  .load-more-wrap{ display:flex; justify-content:center; padding-top:22px; }
  .load-more{
    all:unset; cursor:pointer; font-size:13.5px; font-weight:600;
    padding:10px 22px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft);
  }
  .load-more:hover{ border-color:var(--ink-faint); color:var(--ink); }

  footer.site{
    padding:20px clamp(14px,3vw,32px) 32px; color:var(--ink-faint); font-size:12px;
    border-top:1px solid var(--line);
  }
  footer.site p{ max-width:70ch; }
</style>

<header class="site">
  <div class="header-row">
    <div class="brand">
      <div class="brand-name">STADIUM <span>WIRE</span></div>
      <div class="brand-tagline" id="tagline"></div>
    </div>
    <div class="status-cluster">
      <span class="live-pill"><span class="live-dot"></span>LIVE</span>
      <span class="updated-text" id="statusText"></span>
      <select class="lang-select" id="langSelect" aria-label="Language">
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
        <option value="fr">Français</option>
      </select>
    </div>
  </div>
</header>

<div class="tally-wrap">
  <div class="tally" id="tally"></div>
</div>

<div class="controls" id="topicChips"></div>
<div class="controls" style="padding-top:0;">
  <div class="search-box">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" autocomplete="off">
  </div>
</div>
<div class="result-line" id="resultLine"></div>
<div class="japan-banner" id="japanBanner" hidden>
  <span class="japan-banner-flag">🇯🇵</span>
  <div class="japan-banner-text">
    <div class="japan-banner-title" id="japanBannerTitle"></div>
    <div class="japan-banner-sub" id="japanBannerSub"></div>
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="load-more-wrap" id="loadMoreWrap" hidden>
    <button class="load-more" id="loadMoreBtn"></button>
  </div>
</main>

<footer class="site">
  <p id="footerText"></p>
</footer>

<script>
(function(){
  "use strict";

  const LANGS = ["en","ja","es","zh","fr"];
  const DEFAULT_LANG = "en";

  const UI = {
    en:{ tagline:"World sports business, tech & sponsorship — hourly wire",
      updated:r=>`Last updated: ${r}`, count:n=>`${n} articles`,
      search_ph:"Search by team, company or keyword", reset:"Reset filters",
      showing:(s,tt)=>`Showing ${s} of ${tt}`, empty:"No articles match your filters. Try adjusting them.",
      load_more:"Load more", read_original:"Read original ↗",
      footer:"Every summary here is Stadium Wire's own condensation of reporting from outlets worldwide — follow \"Read original\" for the full source article. New items are collected hourly, and this page is regenerated and republished with each update.",
      just_now:"Just now", min_ago:n=>`${n}m ago`, hr_ago:n=>`${n}h ago`, day_ago:n=>`${n}d ago`, mo_ago:n=>`${n}mo ago`, yr_ago:n=>`${n}y ago`,
      sports:{all:"All",soccer:"Soccer",baseball:"Baseball",basketball:"Basketball",football:"Football",olympics:"Olympics/Multi-sport",esports:"Esports",motorsports:"Motorsports",general:"Industry-wide"},
      topics:{team:"Team News",tech:"Technology",stadium:"Stadium",fan:"Fan Marketing",sponsor:"Sponsorship",biz:"Business"},
      japan_tally:"Japan",
      japan_banner_title:"Japan Sports Business", japan_banner_sub:"J.League, NPB, B.League and the companies behind Japan's sports industry" },
    ja:{ tagline:"世界のスポーツビジネス・テック・スポンサーシップ速報",
      updated:r=>`最終更新: ${r}`, count:n=>`収録記事 ${n} 件`,
      search_ph:"チーム名・企業名・キーワードで検索", reset:"条件をリセット",
      showing:(s,tt)=>`${tt}件中 ${s}件を表示`, empty:"条件に一致する記事が見つかりませんでした。フィルターを調整してください。",
      load_more:"もっと見る", read_original:"元記事を読む ↗",
      footer:"各記事はStadium Wireが世界の主要メディア報道をもとに独自に要約したものです。詳細・引用元の全文は「元記事を読む」リンク先でご確認ください。記事は毎時自動収集され、このページ自体が更新のたびに再生成・再公開されています。",
      just_now:"たった今", min_ago:n=>`${n}分前`, hr_ago:n=>`${n}時間前`, day_ago:n=>`${n}日前`, mo_ago:n=>`${n}ヶ月前`, yr_ago:n=>`${n}年前`,
      sports:{all:"すべて",soccer:"サッカー",baseball:"野球",basketball:"バスケ",football:"アメフト",olympics:"五輪/複数競技",esports:"eスポーツ",motorsports:"モータースポーツ",general:"業界全体"},
      topics:{team:"チーム動向",tech:"テクノロジー",stadium:"スタジアム",fan:"ファンマーケティング",sponsor:"スポンサーシップ",biz:"ビジネス/経営"},
      japan_tally:"国内",
      japan_banner_title:"日本のスポーツビジネス", japan_banner_sub:"Jリーグ・NPB・Bリーグなど、国内スポーツ業界とそれを支える企業の最新動向" },
    es:{ tagline:"Negocio, tecnología y patrocinio del deporte mundial — al minuto",
      updated:r=>`Última actualización: ${r}`, count:n=>`${n} artículos`,
      search_ph:"Busca por equipo, empresa o palabra clave", reset:"Restablecer filtros",
      showing:(s,tt)=>`Mostrando ${s} de ${tt}`, empty:"Ningún artículo coincide con tus filtros. Prueba a ajustarlos.",
      load_more:"Cargar más", read_original:"Leer artículo original ↗",
      footer:"Cada resumen es una síntesis original de Stadium Wire basada en la cobertura de medios de todo el mundo — sigue \"Leer artículo original\" para el artículo completo. Los nuevos artículos se recopilan cada hora y esta página se regenera y republica con cada actualización.",
      just_now:"Ahora mismo", min_ago:n=>`hace ${n} min`, hr_ago:n=>`hace ${n} h`, day_ago:n=>`hace ${n} d`, mo_ago:n=>`hace ${n} meses`, yr_ago:n=>`hace ${n} años`,
      sports:{all:"Todos",soccer:"Fútbol",baseball:"Béisbol",basketball:"Baloncesto",football:"Fútbol americano",olympics:"Olimpiadas/Multideporte",esports:"Esports",motorsports:"Automovilismo",general:"Toda la industria"},
      topics:{team:"Equipos",tech:"Tecnología",stadium:"Estadios",fan:"Marketing de aficionados",sponsor:"Patrocinio",biz:"Negocio"},
      japan_tally:"Japón",
      japan_banner_title:"Negocio deportivo en Japón", japan_banner_sub:"J.League, NPB, B.League y las empresas detrás de la industria deportiva japonesa" },
    zh:{ tagline:"全球体育商业、科技与赞助 — 每小时快讯",
      updated:r=>`最后更新: ${r}`, count:n=>`共 ${n} 篇文章`,
      search_ph:"按球队、企业或关键词搜索", reset:"重置筛选",
      showing:(s,tt)=>`显示 ${tt} 篇中的 ${s} 篇`, empty:"没有符合筛选条件的文章,请调整筛选条件。",
      load_more:"加载更多", read_original:"阅读原文 ↗",
      footer:"本站每篇摘要均由Stadium Wire基于全球媒体报道独立撰写,完整原文请点击“阅读原文”查看。新文章每小时自动收集一次,本页面也会随每次更新而重新生成并发布。",
      just_now:"刚刚", min_ago:n=>`${n}分钟前`, hr_ago:n=>`${n}小时前`, day_ago:n=>`${n}天前`, mo_ago:n=>`${n}个月前`, yr_ago:n=>`${n}年前`,
      sports:{all:"全部",soccer:"足球",baseball:"棒球",basketball:"篮球",football:"美式橄榄球",olympics:"奥运会/综合体育",esports:"电子竞技",motorsports:"赛车运动",general:"行业综合"},
      topics:{team:"球队动态",tech:"科技",stadium:"场馆",fan:"球迷营销",sponsor:"赞助",biz:"商业/经营"},
      japan_tally:"日本",
      japan_banner_title:"日本体育商业", japan_banner_sub:"J联赛、NPB、B联赛及支撑日本体育产业的相关企业最新动态" },
    fr:{ tagline:"Business, technologie et sponsoring du sport mondial — en continu",
      updated:r=>`Dernière mise à jour : ${r}`, count:n=>`${n} articles`,
      search_ph:"Rechercher par équipe, entreprise ou mot-clé", reset:"Réinitialiser les filtres",
      showing:(s,tt)=>`${s} sur ${tt} affichés`, empty:"Aucun article ne correspond à vos filtres. Essayez de les ajuster.",
      load_more:"Charger plus", read_original:"Lire l'article original ↗",
      footer:"Chaque résumé est une synthèse originale de Stadium Wire à partir de reportages du monde entier — suivez « Lire l'article original » pour le texte complet. De nouveaux articles sont collectés chaque heure, et cette page est régénérée et republiée à chaque mise à jour.",
      just_now:"À l'instant", min_ago:n=>`il y a ${n} min`, hr_ago:n=>`il y a ${n} h`, day_ago:n=>`il y a ${n} j`, mo_ago:n=>`il y a ${n} mois`, yr_ago:n=>`il y a ${n} ans`,
      sports:{all:"Tous",soccer:"Football",baseball:"Baseball",basketball:"Basketball",football:"Football américain",olympics:"Jeux olympiques/Multisport",esports:"Esport",motorsports:"Sport automobile",general:"Secteur global"},
      topics:{team:"Équipes",tech:"Technologie",stadium:"Stades",fan:"Marketing des supporters",sponsor:"Sponsoring",biz:"Business"},
      japan_tally:"Japon",
      japan_banner_title:"Business du sport au Japon", japan_banner_sub:"J.League, NPB, B.League et les entreprises qui font vivre l'industrie sportive japonaise" },
  };

// 自動取得データを格納するための配列
  let ARTICLES_DATA = [];

  // JSONを読み込んでUIを更新する関数
  async function loadData() {
    try {
      const res = await fetch('data.json?v=' + new Date().getTime());
      ARTICLES_DATA = await res.json();
      render(); // 読み込み終わったら画面を描画
    } catch (e) {
      console.error("データの読み込みに失敗しました", e);
    }
  }

  const SPORT_KEYS = ["all","soccer","baseball","basketball","football","olympics","esports","motorsports","general"];
  const TOPIC_KEYS = ["team","tech","stadium","fan","sponsor","biz"];

  let lang = DEFAULT_LANG;
  try{
    const saved = localStorage.getItem("stadiumwire_lang");
    if (saved && LANGS.includes(saved)) lang = saved;
  }catch(e){}

  const state = { sport:"all", topics:new Set(), region:null, query:"", pageSize:60 };

  function t(){ return UI[lang]; }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function relTime(iso){
    const ts = t();
    const time = new Date(iso).getTime();
    if (isNaN(time)) return "";
    const diffMs = Date.now()-time;
    const min = Math.floor(diffMs/60000);
    if (min < 1) return ts.just_now;
    if (min < 60) return ts.min_ago(min);
    const hr = Math.floor(min/60);
    if (hr < 24) return ts.hr_ago(hr);
    const day = Math.floor(hr/24);
    if (day < 30) return ts.day_ago(day);
    const month = Math.floor(day/30);
    if (month < 12) return ts.mo_ago(month);
    return ts.yr_ago(Math.floor(month/12));
  }

  function sourceArticles(){
    return ARTICLES_DATA.slice().sort((a,b)=> new Date(b.published_at) - new Date(a.published_at));
  }

  function articleText(a, field){
    return (a.i18n[lang] && a.i18n[lang][field]) || (a.i18n.en && a.i18n.en[field]) || "";
  }

  function renderTally(all){
    const ts = t();
    const counts = {all: all.length, japan: 0};
    SPORT_KEYS.forEach(k=>{ if(k!=="all") counts[k]=0; });
    all.forEach(a=>{
      counts[a.sport] = (counts[a.sport]||0)+1;
      if (a.region==="japan") counts.japan++;
    });
    const el = document.getElementById("tally");
    el.innerHTML = SPORT_KEYS.map(k=>`
      <button class="tally-tile" data-sport="${k}" aria-pressed="${state.sport===k && state.region!=="japan"}">
        <span class="tally-label">${esc(ts.sports[k]||k)}</span>
        <span class="tally-count">${counts[k]||0}</span>
      </button>`).join("")
      + `<button class="tally-tile" id="japanTally" aria-pressed="${state.region==="japan"}">
        <span class="tally-label">${esc(ts.japan_tally)}</span>
        <span class="tally-count">${counts.japan}</span>
      </button>`;
    el.querySelectorAll(".tally-tile[data-sport]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ state.sport = btn.dataset.sport; state.region = null; render(); });
    });
    document.getElementById("japanTally").addEventListener("click", ()=>{
      state.region = "japan"; state.sport = "all"; render();
    });
  }

  function renderTopicChips(){
    const ts = t();
    const el = document.getElementById("topicChips");
    el.innerHTML = TOPIC_KEYS.map(k=>`
      <button class="chip" data-topic="${k}" aria-pressed="${state.topics.has(k)}">${esc(ts.topics[k]||k)}</button>`).join("")
      + `<button class="chip" id="clearTopics" style="border-style:dashed;">${esc(ts.reset)}</button>`;
    el.querySelectorAll(".chip[data-topic]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const k = btn.dataset.topic;
        if (state.topics.has(k)) state.topics.delete(k); else state.topics.add(k);
        render();
      });
    });
    document.getElementById("clearTopics").addEventListener("click", ()=>{
      state.sport="all"; state.topics.clear(); state.region=null; state.query="";
      document.getElementById("searchInput").value="";
      render();
    });
  }

  function matches(a){
    if (state.sport!=="all" && a.sport!==state.sport) return false;
    if (state.region && a.region!==state.region) return false;
    if (state.topics.size>0 && !a.topics.some(k=>state.topics.has(k))) return false;
    if (state.query){
      const hay = (articleText(a,"title")+" "+articleText(a,"summary")+" "+a.source_name).toLowerCase();
      if (!hay.includes(state.query.toLowerCase())) return false;
    }
    return true;
  }

  function cardHtml(a){
    const ts = t();
    const topicBadges = a.topics.map(k=>`<span class="badge-topic">${esc(ts.topics[k]||k)}</span>`).join("");
    return `
      <article class="card">
        <div class="card-top">
          <span class="badge-sport">${esc(ts.sports[a.sport]||a.sport)}</span>
          ${topicBadges}
        </div>
        <div class="title-main">${esc(articleText(a,"title"))}</div>
        <div class="summary-main">${esc(articleText(a,"summary"))}</div>
        <div class="card-foot">
          <span class="source-line"><b>${esc(a.source_name)}</b> ・ <span class="mono">${esc(relTime(a.published_at))}</span></span>
          <a class="read-link" href="${esc(a.source_url)}" target="_blank" rel="noopener noreferrer">${esc(ts.read_original)}</a>
        </div>
      </article>`;
  }

  function applyStaticText(){
    const ts = t();
    document.documentElement.lang = lang;
    document.getElementById("tagline").textContent = ts.tagline;
    document.getElementById("searchInput").placeholder = ts.search_ph;
    document.getElementById("loadMoreBtn").textContent = ts.load_more;
    document.getElementById("footerText").textContent = ts.footer;
    document.getElementById("langSelect").value = lang;
  }

  function render(){
    const ts = t();
    applyStaticText();
    const all = sourceArticles();
    renderTally(all);
    renderTopicChips();
    const filtered = all.filter(matches);
    const shown = filtered.slice(0, state.pageSize);

    const latest = all.reduce((m,a)=> !m || new Date(a.published_at)>new Date(m) ? a.published_at : m, null);
    document.getElementById("statusText").textContent = `${ts.updated(latest?relTime(latest):"—")} ・ ${ts.count(all.length)}`;
    document.getElementById("resultLine").textContent = ts.showing(shown.length, filtered.length);

    const japanBanner = document.getElementById("japanBanner");
    japanBanner.hidden = state.region!=="japan";
    if (state.region==="japan"){
      document.getElementById("japanBannerTitle").textContent = ts.japan_banner_title;
      document.getElementById("japanBannerSub").textContent = ts.japan_banner_sub;
    }

    const grid = document.getElementById("grid");
    grid.innerHTML = shown.length ? shown.map(cardHtml).join("") : `<div class="empty">${esc(ts.empty)}</div>`;

    const moreWrap = document.getElementById("loadMoreWrap");
    moreWrap.hidden = !(filtered.length > shown.length);
  }

  document.getElementById("searchInput").addEventListener("input", (e)=>{
    state.query = e.target.value;
    render();
  });
  document.getElementById("loadMoreBtn").addEventListener("click", ()=>{
    state.pageSize += 60;
    render();
  });
  document.getElementById("langSelect").addEventListener("change", (e)=>{
    lang = LANGS.includes(e.target.value) ? e.target.value : DEFAULT_LANG;
    try{ localStorage.setItem("stadiumwire_lang", lang); }catch(err){}
    render();
  });

loadData(); // 起動時にJSONを読みに行く
  setInterval(loadData, 60000); // 1分ごとに最新のJSONを読み込みに行く

})();
</script>
